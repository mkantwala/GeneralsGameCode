name: Check ROTR H-20

on:
  pull_request:
    branches: [rotr-base]
    paths:
      - mods/rotr/**
      - .github/workflows/check-rotr-h20.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mods/rotr/tools/
            /mods/rotr/archives/Rotr_INI/
            /mods/rotr/archives/Rotr_English/Data/
      - name: Check data integration and archive round-trip
        run: python3 mods/rotr/tools/check_h20.py
