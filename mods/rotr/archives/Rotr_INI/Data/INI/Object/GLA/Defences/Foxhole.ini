;------------------------------------------------------------------------------
Object MercenaryFoxHole

  ; *** ART Parameters ***
  SelectPortrait          = SUMercFoxhole_L
  ButtonImage             = SUMercFoxhole
  
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model         = UIMercGnr_Hole
      HideSubObject = VAR02 VAR03
    End
  End

  Side = GLA
  EditorSorting = STRUCTURE
  BuildVariations =  MercenaryFoxHole_Var1 MercenaryFoxHole_Var2  MercenaryFoxHole_Var3
  
  KindOf          = PRELOAD STRUCTURE SELECTABLE CAN_ATTACK IMMOBILE IMMUNE_TO_CAPTURE

End

;------------------------------------------------------------------------------
Object MercenaryFoxHole_Var1

  ; *** ART Parameters ***
  SelectPortrait          = SUMercFoxhole_L
  ButtonImage             = SUMercFoxhole
  
  UpgradeCameo1          = Upgrade_GLAAPBullets
  UpgradeCameo2          = Upgrade_GLACamouflage
  
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model         = UIMercGnr_Hole
      HideSubObject = VAR02 VAR03
    End
  End
  
  Draw = W3DModelDraw ModuleTag_Gunner01
    OkToChangeModelColor = Yes
    
    DefaultConditionState
      Model                 = NVDeva_U2
    End
    AliasConditionState = USING_WEAPON_A
 
   ConditionState = RIDER1
      Model               = UIMercGnr_SKN
      IdleAnimation       = UIMercGnr_SKL.UIMercGnr_IDA 0 10
      IdleAnimation       = UIMercGnr_SKL.UIMercGnr_IDB
      AnimationMode       = ONCE
      Turret              = BONE_HIP
      WeaponFireFXBone    = PRIMARY Muzzle
      WeaponLaunchBone    = PRIMARY Muzzle
      AnimationSpeedFactorRange = 1.2 1.2
    End

    ; ------- Attack Animations
    ConditionState        = RIDER1 USING_WEAPON_A 
      Model               = UIMercGnr_SKN
      Animation           = UIMercGnr_SKL.UIMercGnr_ATA
      AnimationMode       = LOOP
      Flags               = MAINTAIN_FRAME_ACROSS_STATES
      Turret              = BONE_HIP
      WeaponFireFXBone    = PRIMARY Muzzle
      WeaponLaunchBone    = PRIMARY Muzzle
      TransitionKey       = TRANS_Firing
      AnimationSpeedFactorRange = 1.5 1.5
    End
    
  End
  
  PlacementViewAngle = -45

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Foxhole
  Side             = GLA
  EditorSorting    = SYSTEM
  
  EnergyProduction = 0
  VisionRange     = 250.0
  ShroudClearingRange     = 250.0
  
  ArmorSet
    Conditions      = None
    Armor           = StructureArmor
    DamageFX        = DefaultDamageFX
  End
 
  WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY   NONE
  End
 
  WeaponSet
    Conditions        = WEAPON_RIDER1 
    Weapon            = PRIMARY   MercenaryFoxholeMachineGunWeapon
    Weapon            = SECONDARY MercenaryFoxholeHoldfireWeapon
    AutoChooseSources = SECONDARY NONE
  End
 
  WeaponSet
    Conditions        = HERO WEAPON_RIDER1 
    Weapon            = PRIMARY   MercenaryFoxholeMachineGunHeroicWeapon
    Weapon            = SECONDARY MercenaryFoxholeHoldfireWeapon
    AutoChooseSources = SECONDARY NONE
  End
  
  ExperienceValue       = 40 60  80  100  ;Experience point value at each level
  ExperienceRequired    = 0  300 400 600  ;Experience points needed to gain each level
  IsTrainable           = Yes             ;Can gain experience
  
  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
 ;KindOf          = PRELOAD STRUCTURE SELECTABLE CAN_ATTACK IMMOBILE IMMUNE_TO_CAPTURE CAN_SEE_THROUGH_STRUCTURE STICK_TO_TERRAIN_SLOPE FS_BASE_DEFENSE
  KindOf          = PRELOAD SELECTABLE CAN_ATTACK IMMOBILE IMMUNE_TO_CAPTURE CAN_SEE_THROUGH_STRUCTURE STICK_TO_TERRAIN_SLOPE FS_BASE_DEFENSE CAN_CAST_REFLECTIONS
  Body            = StructureBody ModuleTag_02
    MaxHealth       = 250.0   
    InitialHealth   = 250.0
  End

  ; *** AUDIO Parameters ***
  VoiceSelect = MercenaryFoxholeSelect
  VoiceAttack = MerceneryVoiceAttack
  
  Behavior = AIUpdateInterface ModuleTag_AI03
    Turret
      TurretTurnRate        = 360
      RecenterTime          = 999999999999
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes Stealthed ATTACK_BUILDINGS
    MoodAttackCheckRate        = 30
  End  

  Behavior = RiderChangeContain ModuleTag_16
  
    Rider1 = GLAInfantryMerceneryGunner    RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GLAInfantryMercenaryGunnerFoxholeCommandSet SET_NORMAL
    Rider8 = GenericFakeRider1_Default_Rank RIDER8 WEAPON_RIDER8 STATUS_RIDER8 StopOnlyGenericCommandSet SET_NORMAL
    ScuttleDelay          = 1
    ScuttleStatus         = TOPPLED

    ;Standard TransportContain stuff
    Slots                 = 1
    InitialPayload        = GenericFakeRider1_Default_Rank 1
    DamagePercentToUnits  = 100%
    BurnedDeathToUnits    = No
    AllowInsideKindOf     = CAN_ATTACK
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
    EnterSound            = GarrisonEnter
  End
  
  Behavior = StealthUpdate ModuleTag_Stealth01
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = ATTACKING
    RequiredStatus              = STATUS_RIDER1
    InnateStealth               = No ;Requires upgrade first
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  
  Behavior = StealthUpgrade ModuleTag_Stealth02
    TriggeredBy = Upgrade_GLACamouflage
  End
  
  Behavior = WeaponBonusUpgrade ModuleTag_ApBullets01
    TriggeredBy = Upgrade_GLAAPBullets
  End
  
  Behavior = DestroyDie ModuleTag_11
    DeathTypes = ALL
  End

  Behavior = FXListDie ModuleTag_072415
    DeathFX = FX_MerceneryFoxHoleCollapse
  End

  Behavior = CreateObjectDie ModuleTag_1123241
    RequiredStatus = STATUS_RIDER1
    CreationList   = OCL_GLAMercenaryFoxHoleInfantryDeathObject
  End

  Behavior = FlammableUpdate ModuleTag_07
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Geometry            = BOX
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 6.0
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End

