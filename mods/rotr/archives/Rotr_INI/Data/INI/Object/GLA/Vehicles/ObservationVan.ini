;------------------------------------------------------------------------------
Object GLAVehicleRadarVan

  ; *** ART Parameters ***
  SelectPortrait         = SURadarVan_L
  ButtonImage            = SURadarVan
  
  UpgradeCameo1 = Upgrade_GLARadarVanScan
  UpgradeCameo2 = Upgrade_GLAGPSScrambler
  UpgradeCameo3 = Upgrade_GLAJunkRepair
  
  Draw = W3DOverlordTruckDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ExtraPublicBone = GPSFX01
    
    ConditionState = None
      Model = UVObsVan
      Animation = UVObsVan.UVObsVan
      AnimationMode = LOOP
      HideSubObject = Upgrade01 Upgrade02
      Flags = MAINTAIN_FRAME_ACROSS_STATES
    End
    
    ConditionState = REALLYDAMAGED
      Model = UVObsVan_D
      Animation = UVObsVan_D.UVObsVan_D
      AnimationMode = LOOP
      HideSubObject = Upgrade01 Upgrade02
      Flags = MAINTAIN_FRAME_ACROSS_STATES
    End
    AliasConditionState = RUBBLE

    ;Radar Scan Stuff
    ConditionState = USER_1
      Model = UVObsVan
      Animation = UVObsVan.UVObsVan
      AnimationMode = LOOP
      HideSubObject = Upgrade02
      ShowSubObject = Upgrade01
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      ParticleSysBone = DISH GLAVanRadarEffect
    End
    
    ConditionState = USER_1 REALLYDAMAGED
      Model = UVObsVan_D
      Animation = UVObsVan_D.UVObsVan_D
      AnimationMode = LOOP
      HideSubObject = Upgrade02
      ShowSubObject = Upgrade01
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      ParticleSysBone = DISH GLAVanRadarEffect
    End
    AliasConditionState = USER_1 RUBBLE
    
    ;Radar GPS Scrambler Stuff
    ConditionState = USER_2
      Model = UVObsVan
      Animation = UVObsVan.UVObsVan
      AnimationMode = LOOP
      HideSubObject = Upgrade01
      ShowSubObject = Upgrade02
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      ;ParticleSysBone = GPSFX01 GPSScramberlMarkerParticle
    End
    
    ConditionState = USER_2 REALLYDAMAGED
      Model = UVObsVan_D
      Animation = UVObsVan_D.UVObsVan_D
      AnimationMode = LOOP
      HideSubObject = Upgrade01
      ShowSubObject = Upgrade02
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      ;ParticleSysBone = GPSFX01 GPSScramberlMarkerParticle
    End
    AliasConditionState = USER_2 RUBBLE
    
    TrackMarks = EXTireTrack.tga
    
    LeftFrontTireBone  = Tire01
    RightFrontTireBone = Tire02
    LeftRearTireBone   = Tire03
    RightRearTireBone  = Tire04
    TireRotationMultiplier = 0.2   ; this * speed = rotation.
    PowerslideRotationAddition = 2.5   ; This speed is added to the rotation speed when powersliding.
  End
  
  Draw = W3DModelDraw ModuleTag_EngineExhaust01
    
    ConditionState        = NONE
      Model               = UVObsVan_B
      ParticleSysBone     = EXHAUST01 GLATankEngineSmokeLight
    End
    
    ConditionState        = MOVING
      Model               = UVObsVan_B
      ParticleSysBone     = EXHAUST01 GLATankEngineSmokeHeavy
    End
    
  End
  
  Draw = W3DModelDraw ModuleTag_DecalAttachment01

    ExtraPublicBone      = FIREPOINT01

    DefaultConditionState
      Model             = EXDtectDcl_B
      Animation         = EXDtectDcl_B.EXDtectDcl_B
      AnimationMode     = ONCE
      TransitionKey     = TRANS_NOT_UPGRADED
    End
    AliasConditionState = ACTIVELY_CONSTRUCTING
    
    ConditionState      = USER_1
      Model             = EXDtectDcl_B
      TransitionKey     = TRANS_UPGRADED
      WaitForStateToFinishIfPossible = TRANS_SHOW_DETECTION_RANGE
    End

    ConditionState      = USER_1 ACTIVELY_CONSTRUCTING
      Model             = EXDtectDcl
      Animation         = EXDtectDcl.EXDtectDcl
      AnimationMode     = ONCE
      TransitionKey     = TRANS_SHOW_DETECTION_RANGE
      WaitForStateToFinishIfPossible = TRANS_NOT_UPGRADED
    End

  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:RadarVan
  Side = GLA
  EditorSorting   = VEHICLE
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)
  
  
  WeaponSet
    Conditions = None 
    Weapon = PRIMARY  SupportVehicleDummyWeapon
  End
  
  
  ArmorSet
    Conditions      = None
    Armor           = TruckArmor
    DamageFX        = TankDamageFX
  End
  
  BuildCost       = 200
  BuildTime       = 5.0          ;in seconds    
  VisionRange     = 200
  ShroudClearingRange = 500

  IsTrainable = No
  CrusherLevel           = 0  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet      = GLAVehicleRadarVanCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect = RadarVanVoiceSelect
  VoiceMove = RadarVanVoiceMove
  VoiceAttack = RadarVanVoiceMove
  SoundMoveStart = RadarVanMoveStart
  SoundMoveStartDamaged = RadarVanMoveStart

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = RadarVanVoiceCreate
    TurretMoveStart = NoSound
    TurretMoveLoop = TurretMoveLoop  
    VoiceCrush      = RadarVanVoiceCrush
    VoiceEnter = RadarVanVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS VEHICLE SALVAGER SCORE CAN_ATTACK IGNORES_SELECT_ALL

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 200
    InitialHealth   = 200

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 400
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  ExperienceValue    = 5 5 5 5     ;Experience point value at each level


  Behavior = AutoHealBehavior ModuleTag_08
    HealingAmount = 2
    HealingDelay = 1000 ; msec
    TriggeredBy = Upgrade_GLAJunkRepair
  End

  Behavior = AIUpdateInterface ModuleTag_09
  End
  Locomotor = SET_NORMAL RadarVanLocomotor

  Behavior = PhysicsBehavior ModuleTag_10
    Mass = 50.0
  End

; The default explosion
  Behavior = SlowDeathBehavior  ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 5
    ModifierBonusPerOverkillPercent = 20%  ; negative means less likely to pick this in the face of much damage, positive means more likely
    DestructionDelay = 0
    DestructionDelayVariance = 200
    FX = FINAL FX_BuggyNewDeathExplosion
    OCL = FINAL OCL_RadarVanDeathEffect
  End
  
  Behavior = ProductionUpdate ModuleTag_Production01
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  
  ;Radar Scan Equipment  

  Behavior = ObjectCreationUpgrade ModuleTag_RadarScan01
    UpgradeObject = OCL_RadarVanScan
    TriggeredBy   = Upgrade_GLARadarVanScan
    ConflictsWith = Upgrade_GLAGPSScrambler
  End
  
  Behavior = ModelConditionUpgrade ModuleTag_RadarScan02
    ConditionFlag = USER_1
    TriggeredBy   = Upgrade_GLARadarVanScan
  End
  
  Behavior = CommandSetUpgrade ModuleTag_RadarScan03
    TriggeredBy = Upgrade_GLARadarVanScan
    CommandSet  = GLAVehicleRadarVanScanUpgradedCommandSet
  End
  
  Behavior = ObjectCreationUpgrade ModuleTag_RadarScan04
    UpgradeObject = OCL_GenericStealthDetectionRangeIndicatorTimer
    TriggeredBy   = Upgrade_GLAWorkerFakeCommandSet Upgrade_GLARadarVanScan
    RequiresAllTriggers = Yes
  End

  Behavior = OverlordContain ModuleTag_RadarScan05
    Slots                   = 1
    DamagePercentToUnits    = 100%
    AllowInsideKindOf       = PORTABLE_STRUCTURE
    PayloadTemplateName     = GLAObservationVanDetectionRangeIndicatorDecalObject
  End
  
  ;GPS Scrambler Equipment
  Behavior = StatusBitsUpgrade ModuleTag_GPSScrambler01
    TriggeredBy   = Upgrade_GLAGPSScrambler
    ConflictsWith = Upgrade_GLARadarVanScan
    FXListUpgrade = FX_GPSScramblerActivate
    StatusToSet   = STATUS_RIDER8
  End

  Behavior = FireWeaponCollide ModuleTag_GPSScrambler02
    CollideWeapon  = GPSScramblerWeapon
    RequiredStatus = STATUS_RIDER8
  End

  Behavior = FireWeaponCollide ModuleTag_GPSScrambler03
    CollideWeapon  = GPSScramblerFieldDecalWeapon
    RequiredStatus = STATUS_RIDER8
  End
  
  Behavior = FireWeaponUpdate ModuleTag_GPSScrambler04
    Weapon = GLACommandTruckRadarCollisionDummyWeapon
  End
  
  Behavior = ModelConditionUpgrade ModuleTag_GPSScrambler05
    ConditionFlag = USER_2
    TriggeredBy   = Upgrade_GLAGPSScrambler
  End
  
  Behavior = CommandSetUpgrade ModuleTag_GPSScrambler06
    TriggeredBy = Upgrade_GLAGPSScrambler
    CommandSet  = GLAVehicleRadarVanGPSUpgradedCommandSet
  End
  
  Behavior = FlammableUpdate ModuleTag_13
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = DestroyDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
  End
  
  ; A crushing defeat
  Behavior = FXListDie ModuleTag_17
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_18
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End

  Behavior                 = TransitionDamageFX ModuleTag_19
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_CrusaderDamageTransition
  End
  
  Behavior = StealthUpdate ModuleTag_GPSStealth01
    StealthDelay                = 2000 ; msec
    InnateStealth               = Yes
    RequiredStatus              = REASSIGN_PARKING ;Used exclusively by the GPS Scrambler
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End

  Behavior = EjectPilotDie ModuleTag_HijackerEmerge01
    DeathTypes = ALL -CRUSHED -SPLATTED
    RequiredStatus = HIJACKED
    VeterancyLevels =  ALL
    GroundCreationList = OCL_HijackerEmerge
    AirCreationList = OCL_HijackerEmergeViaParachute
  End
  
  Behavior = FXListDie ModuleTag_HijackerEmerge02
    RequiredStatus = HIJACKED
    DeathTypes = ALL -CRUSHED -SPLATTED
    DeathFX = FX_HijackerEmerge
  End
  
  Geometry = BOX
  GeometryMajorRadius = 16.0
  GeometryMinorRadius = 6.0
  GeometryHeight = 12.5     
  GeometryIsSmall = Yes    
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ;minimum elevation angle above horizon. Used to limit shadow length

End

;------------------------------------------------------------------------------
Object GLAObservationVanDetectionRangeIndicatorDecalObject

  Draw = W3DDependencyModelDraw ModuleTag_01
    AttachToBoneInContainer = FIREPOINT01
    DefaultConditionState
      Model               = ExJammerRadius
    End
  End

  EditorSorting = SYSTEM
  TransportSlotCount = 1

  ArmorSet
    Conditions      = None
    Armor           = InvulnerableArmorAll
    DamageFX        = None
  End


  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CLICK_THROUGH NO_COLLIDE FS_FAKE PORTABLE_STRUCTURE

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 10.0
    InitialHealth   = 10.0
  End

  Behavior             = DestroyDie ModuleTag_05
  End
  
  Geometry            = BOX
  GeometryMajorRadius = 500.0
  GeometryMinorRadius = 500.0
  GeometryHeight      = 20.0
  GeometryIsSmall     = Yes
  Scale               = 20.0 
  ShadowTexture = SCCDetection
  ShadowSizeX = 520
  ShadowSizeY = 520
  
End