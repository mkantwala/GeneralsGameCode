;------------------------------------------------------------------------------
Object GLAInfantryMerceneryGrenadier

  ; *** ART Parameters ***
  SelectPortrait          = SUMercenary_L
  ButtonImage             = SUMercenary
  
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model               = EIMerc_SKN
      IdleAnimation       = RIShkTrp_SKL.RIShkTrp_STN
      AnimationMode       = ONCE
    End
  End

  ; set cost and time fields here or else they won't work
  BuildCost = 600
  BuildTime = 13.0          ;in seconds
  
  Prerequisites
    Object  = GLATier2TechEscalation GLAPalace
    Science = SCIENCE_Mercenaries
  End

  Side = GLA
  EditorSorting = INFANTRY
  BuildVariations =  GLAInfantryMerceneryGrenadier_Var1 GLAInfantryMerceneryGrenadier_Var2
  
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS INFANTRY HUGE_VEHICLE SCORE SALVAGER

End

;------------------------------------------------------------------------------
Object GLAInfantryMerceneryGrenadier_Var1

  ; *** ART Parameters ***
  SelectPortrait          = SUMercenary_L
  ButtonImage             = SUMercenary
  
  UpgradeCameo1 = Upgrade_GLAAPBullets
  UpgradeCameo2 = Upgrade_GLACamouflage
  ;UpgradeCameo3 = Upgrade_GLAInfantryRebelBoobyTrapAttack
  ;UpgradeCameo4 = 
  ;UpgradeCameo5 = 

  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes

    ; ---- standing
    DefaultConditionState
      Model               = EIMerc_SKN
      IdleAnimation       = RIShkTrp_SKL.RIShkTrp_STN 0 35
      IdleAnimation       = RIShkTrp_SKL.RIShkTrp_IDA 
      IdleAnimation       = RIShkTrp_SKL.RIShkTrp_IDB 
      AnimationMode       = ONCE
      WeaponFireFXBone    = PRIMARY Muzzle
      WeaponFireFXBone    = SECONDARY Muzzle
      WeaponLaunchBone    = SECONDARY Muzzle
      ;HideSubObject       = GLASSES
      TransitionKey       = TRANS_RIDER1_STANDING
    End
    AliasConditionState   = RIDER1
    AliasConditionState   = RIDER1 REALLYDAMAGED

    ; ---- moving
    ConditionState        = RIDER1 MOVING
      Animation           = RIShkTrp_SKL.RIShkTrp_MVA 25
      AnimationMode       = LOOP
      Flags               = RANDOMSTART
      TransitionKey       = TRANS_RIDER1_MOVING
      ParticleSysBone     = None InfantryDustTrails
    End
    AliasConditionState   = RIDER1 MOVING ATTACKING
    AliasConditionState   = RIDER1 MOVING REALLYDAMAGED
    AliasConditionState   = RIDER1 MOVING ATTACKING REALLYDAMAGED
    

    ; ---- firing
    ConditionState = RIDER1 FIRING_A
      Animation = RIShkTrp_SKL.RIShkTrp_ASA
      AnimationMode = ONCE
      AnimationSpeedFactorRange = 1.2 1.2
      Flags = START_FRAME_FIRST
      TransitionKey = TRANS_RIDER1_START_FIRING
    End
    AliasConditionState = RIDER1 FIRING_A REALLYDAMAGED
    AliasConditionState = RIDER1 BETWEEN_FIRING_SHOTS_A 
    AliasConditionState = RIDER1 BETWEEN_FIRING_SHOTS_A REALLYDAMAGED
    
    ConditionState = RIDER1 USING_WEAPON_A
      Animation = RIShkTrp_SKL.RIShkTrp_ASA
      AnimationMode = ONCE
      Flags = START_FRAME_LAST
      WaitForStateToFinishIfPossible = TRANS_RIDER1_START_FIRING
    End
    AliasConditionState = RIDER1 USING_WEAPON_A REALLYDAMAGED
    AliasConditionState = RIDER1 RELOADING_A
    AliasConditionState = RIDER1 RELOADING_A REALLYDAMAGED
    
    
    ; Grenade Firing animation
    
    ConditionState      = RIDER1 FIRING_B
      Model             = EIMerc_SKN_B
      Animation         = AIHERO_SKL.AIHERO_ATD
      AnimationMode     = ONCE
      AnimationSpeedFactorRange = 1.5 1.5
      TransitionKey     = TRANS_RIDER1_FIRING_B
    End

    ConditionState      = RIDER1 BETWEEN_FIRING_SHOTS_B
      Model             = EIMerc_SKN_B
      Animation         = AIHERO_SKL.AIHERO_ATD
      AnimationMode     = MANUAL
      Flags             = START_FRAME_LAST
      WaitForStateToFinishIfPossible = TRANS_RIDER1_FIRING_B
    End
    AliasConditionState = RIDER1 RELOADING_B

    ; Injured Grenade Firing animation
    ConditionState      = RIDER1 FIRING_B REALLYDAMAGED
      Model             = EIMerc_SKN_B
      Animation         = AIHERO_SKL.AIHERO_IATD
      AnimationMode     = ONCE
      AnimationSpeedFactorRange = 1.5 1.5
      TransitionKey     = TRANS_RIDER1_FIRING_B_DAMAGED
    End

    ConditionState      = RIDER1 BETWEEN_FIRING_SHOTS_B REALLYDAMAGED
      Model             = EIMerc_SKN_B
      Animation         = AIHERO_SKL.AIHERO_IATD
      AnimationMode     = MANUAL
      Flags             = START_FRAME_LAST
      WaitForStateToFinishIfPossible = TRANS_RIDER1_FIRING_B_DAMAGED
    End
    AliasConditionState = RIDER1 RELOADING_B REALLYDAMAGED

    TransitionState     = TRANS_RIDER1_FIRING_B TRANS_RIDER1_FIRING_B_DAMAGED
      Model             = EIMerc_SKN_B
      Animation         = AIHERO_SKL.AIHERO_IATDHIT
      AnimationMode     = ONCE
    End
    
    ; ---- dying 
    ConditionState        = RIDER1 DYING
      Animation           = RIShkTrp_SKL.RIShkTrp_DBA
      AnimationMode       = ONCE
      TransitionKey       = TRANS_RIDER1_DYING
    End

    TransitionState = TRANS_RIDER1_DYING TRANS_RIDER1_FLAILING
      Model     = EIMerc_SKN_B
      Animation = UITunF_SKL.UITunF_ADTA1
      Animation = UITunF_SKL.UITunF_ADTE1
      Animation = UITunF_SKL.UITunF_ADTF1
      AnimationMode = ONCE
      HideSubObject = GUN
    End

    ConditionState = RIDER1 DYING EXPLODED_FLAILING
      Model     = EIMerc_SKN_B
      Animation = UITunF_SKL.UITunF_ADTA2
      Animation = UITunF_SKL.UITunF_ADTE2
      Animation = UITunF_SKL.UITunF_ADTF2
      AnimationMode = LOOP
      TransitionKey = TRANS_RIDER1_FLAILING
      HideSubObject = GUN
    End

    ConditionState = RIDER1 DYING EXPLODED_BOUNCING
      Model     = EIMerc_SKN_B
      Animation = UITunF_SKL.UITunF_ADTA3
      Animation = UITunF_SKL.UITunF_ADTE3
      Animation = UITunF_SKL.UITunF_ADTF3
      AnimationMode = ONCE
      TransitionKey = None
      HideSubObject = GUN
    End
    
    ;Machette animations

    ; ---- standing
   ConditionState         = RIDER2
      Model               = EIMerc_SKN_C
      IdleAnimation       = UIMerc_SKL.UIMerc_IDA 0 15
      IdleAnimation       = UIMerc_SKL.UIMerc_IDB 
      IdleAnimation       = UIMerc_SKL.UIMerc_IDC
      AnimationMode       = ONCE
      HideSubObject       = HEAD02 WPN03;GLASSES
      TransitionKey       = TRANS_RIDER2_STANDING
    End
    AliasConditionState   = RIDER2 REALLYDAMAGED

    ; ---- moving
    ConditionState        = RIDER2 MOVING
      Model               = EIMerc_SKN_C
      Animation           = UIMerc_SKL.UIMerc_RNA 25
      AnimationMode       = LOOP
      HideSubObject       = HEAD02 WPN03;GLASSES
      Flags               = RANDOMSTART
      TransitionKey       = TRANS_RIDER2_MOVING
      ParticleSysBone     = None InfantryDustTrails
    End
    AliasConditionState   = RIDER2 MOVING ATTACKING
    AliasConditionState   = RIDER2 MOVING REALLYDAMAGED
    AliasConditionState   = RIDER2 MOVING ATTACKING REALLYDAMAGED
    
    ; ---- machette attack
    ConditionState = RIDER2 PREATTACK_A
      Model = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ATA
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
    End
    AliasConditionState = RIDER2 PREATTACK_A REALLYDAMAGED
    
    ConditionState = RIDER2 FIRING_A
      Model = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ATB
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
      TransitionKey = TRANS_RIDER2_START_FIRING
    End
    AliasConditionState = RIDER2 FIRING_A REALLYDAMAGED
    
    ConditionState = RIDER2 USING_WEAPON_A
      Model = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_IDA
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
      TransitionKey = TRANS_RIDER2_RELOADING
      WaitForStateToFinishIfPossible = TRANS_RIDER2_START_FIRING
    End
    AliasConditionState = RIDER2 USING_WEAPON_A REALLYDAMAGED
    AliasConditionState = RIDER2 RELOADING_A
    AliasConditionState = RIDER2 RELOADING_A REALLYDAMAGED
    AliasConditionState = RIDER2 BETWEEN_FIRING_SHOTS_A 
    AliasConditionState = RIDER2 BETWEEN_FIRING_SHOTS_A REALLYDAMAGED

    TransitionState = TRANS_RIDER2_RELOADING TRANS_RIDER2_STANDING
      Model = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ATB
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
    End

    TransitionState = TRANS_RIDER2_START_FIRING TRANS_RIDER2_STANDING
      Model = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ATB
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
    End
    
    ; ---- dying 
    ConditionState        = RIDER2 DYING
      Model               = EIMerc_SKN_C
      Animation           = UIMerc_SKL.UIMerc_DTA
      Animation           = UIMerc_SKL.UIMerc_DTB
      AnimationMode       = ONCE
      HideSubObject       = HEAD02 WPN03;GLASSES
      TransitionKey       = TRANS_RIDER2_DYING
    End

    TransitionState = TRANS_RIDER2_DYING TRANS_RIDER2_FLAILING
      Model     = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ADTE1
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
    End

    ConditionState = RIDER2 DYING EXPLODED_FLAILING
      Model     = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ADTE2
      AnimationMode = LOOP
      HideSubObject = HEAD02 WPN03;GLASSES
      TransitionKey = TRANS_RIDER2_FLAILING
    End

    ConditionState = RIDER2 DYING EXPLODED_BOUNCING
      Model     = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ADTE3
      AnimationMode = ONCE
      HideSubObject = HEAD02 WPN03;GLASSES
      TransitionKey = None
    End
    
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Mercenary
  Side                = GLA
  EditorSorting       = SYSTEM
  TransportSlotCount  = 1                 ;how many "slots" we take in a transport (0 == not transportable)
 
  WeaponSet
    Conditions        = WEAPON_RIDER1 
    Weapon            = PRIMARY   MercenaryAssaultRifleWeapon
    Weapon            = SECONDARY MercenaryGrenadeLauncherWeapon
    AutoChooseSources = SECONDARY NONE
  End
 
  WeaponSet
    Conditions        = WEAPON_RIDER2
    Weapon            = PRIMARY   MercenaryMachetteKnifeAttack
    Weapon            = SECONDARY GuardDogBiteGuardRangeWeapon
  End
  
  ArmorSet
    Conditions      = None
    Armor           = HumanArmor
    DamageFX        = InfantryDamageFX
  End
  
  Prerequisites
    Object  = GLABlackMarket
    Science = SCIENCE_Mercenaries
  End
  
  VisionRange         = 220
  ShroudClearingRange = 220

  BuildCost = 500
  BuildTime = 12.0          ;in seconds

  ExperienceValue     = 40 60  80  100  ;Experience point value at each level
  ExperienceRequired  = 0  300 400 600  ;Experience points needed to gain each level
  IsTrainable         = Yes             ;Can gain experience
  CrushableLevel      = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles

  ; *** AUDIO Parameters ***
  VoiceSelect           = MerceneryVoiceSelect
  VoiceMove             = MerceneryVoiceMove
  VoiceGuard            = MerceneryVoiceMove
  VoiceAttack           = MerceneryVoiceAttack
  VoiceFear             = MerceneryVoiceFear
  
  UnitSpecificSounds
    VoiceSubdue         = MerceneryVoiceAttackMachete
    VoiceCreate         = MerceneryVoiceCreate
    VoiceGarrison       = MerceneryVoiceGarrison
    VoiceEnter          = MerceneryVoiceMove
    VoiceEnterHostile   = MerceneryVoiceMove
    VoiceGetHealed      = MerceneryVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS INFANTRY HUGE_VEHICLE SCORE SALVAGER

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 300.0
    InitialHealth   = 300.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL ConscriptHumanLocomotor
  Locomotor = SET_SUPERSONIC MercenaryMachetteLocomotor

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End
  
  ;*************************************
  ;******Transformation Code Start********
  ;*************************************
  
  Behavior = RiderChangeContain ModuleTag_Transform01

    ;;;;Normal Rank
    Rider1 = GenericFakeRider1_Default_Rank  RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GLAInfantryMercenaryCommandSet SET_NORMAL
    Rider2 = GenericFakeRider2_Default_Rank RIDER2 WEAPON_RIDER2 STATUS_RIDER2 GLAInfantryMercenaryMachetteGrenadierCommandSet SET_SUPERSONIC

    ;;;;Veteran Rank 
    Rider3 = GenericFakeRider1_Veteran_Rank  RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GLAInfantryMercenaryCommandSet SET_NORMAL
    Rider4 = GenericFakeRider2_Veteran_Rank RIDER2 WEAPON_RIDER2 STATUS_RIDER2 GLAInfantryMercenaryMachetteGrenadierCommandSet SET_SUPERSONIC

    ;;;;Elite Rank
    Rider5 = GenericFakeRider1_Elite_Rank    RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GLAInfantryMercenaryCommandSet SET_NORMAL
    Rider6 = GenericFakeRider2_Elite_Rank   RIDER2 WEAPON_RIDER2 STATUS_RIDER2 GLAInfantryMercenaryMachetteGrenadierCommandSet SET_SUPERSONIC

    ;;;;Heroic Rank
    Rider7 = GenericFakeRider1_Heroic_Rank   RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GLAInfantryMercenaryCommandSet SET_NORMAL
    Rider8 = GenericFakeRider2_Heroic_Rank  RIDER2 WEAPON_RIDER2 STATUS_RIDER2 GLAInfantryMercenaryMachetteGrenadierCommandSet SET_SUPERSONIC

    ;Standard TransportContain stuff
    Slots                 = 1
    InitialPayload        = GenericFakeRider1_Default_Rank 1
    DamagePercentToUnits  = 100%
    BurnedDeathToUnits    = No
    AllowInsideKindOf     = CAN_ATTACK    
    ScuttleDelay          = 100
    ScuttleStatus         = TOPPLED
  End  
  
  Behavior = GrantUpgradeCreate ModuleTag_Transform02
    UpgradeToGrant     = Upgrade_GLAWorkerRealCommandSet
  End

  Behavior = ProductionUpdate  ModuleTag_Transform03
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  
  Behavior = FireWeaponCollide ModuleTag_Transform04
    CollideWeapon   = GrenadierSwitchToHighExplosiveRounds
    RequiredStatus  = HIJACKED
  End

  Behavior = ObjectCreationUpgrade ModuleTag_Transform05
    UpgradeObject   = OCL_MercenaryStandardMode
    TriggeredBy     = Upgrade_GLAWorkerRealCommandSet
  End 
  
  Behavior = ObjectCreationUpgrade ModuleTag_Transform06
    UpgradeObject   = OCL_MercenaryMachetteMode
    TriggeredBy     = Upgrade_GLAWorkerFakeCommandSet
    ConflictsWith   = Upgrade_ChinaOverlordGattlingCannon
  End 
  
  Behavior = FireWeaponCollide  ModuleTag_Transform07
    CollideWeapon   = GrenadierSwitchToHighAirburstRounds
    RequiredStatus  = REPULSOR
  End

  Behavior = MaxHealthUpgrade ModuleTag_Transform08
    TriggeredBy   = Upgrade_GLAWorkerRealCommandSet
    AddMaxHealth  = -100.0
    ChangeType    = PRESERVE_RATIO
  End
  
  Behavior = MaxHealthUpgrade ModuleTag_Transform09
    TriggeredBy   = Upgrade_GLAWorkerFakeCommandSet
    AddMaxHealth  = 100.0
    ChangeType    = PRESERVE_RATIO
    ConflictsWith = Upgrade_ChinaOverlordGattlingCannon
  End
  
  Behavior = ObjectCreationUpgrade ModuleTag_Transform10
    UpgradeObject   = OCL_MercenaryMachetteModeDelay
    TriggeredBy     = Upgrade_ChinaOverlordGattlingCannon
  End 
  
  Behavior = GrantUpgradeCreate ModuleTag_Transform11
    UpgradeToGrant     = Upgrade_ChinaOverlordGattlingCannon
  End
  
  ;************************************
  ;******Transformation Code End********
  ;************************************
 
;  Behavior = SquishCollide ModuleTag_11
;  End
    
  Behavior = StealthUpdate ModuleTag_Stealth01
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = ATTACKING USING_ABILITY
    ForbiddenStatus             = STATUS_RIDER2 ;running around screaming with a machete is not exactly stealthy afterall
    InnateStealth               = No ;Requires upgrade first
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  
  Behavior = StealthUpgrade ModuleTag_Stealth02
    TriggeredBy = Upgrade_GLACamouflage
  End

; --- begin Death modules ---
  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes          = ALL -CRUSHED -SPLATTED -EXPLODED -BURNED -POISONED -POISONED_BETA -POISONED_GAMMA -LASERED -EXTRA_2 -EXTRA_3 -EXTRA_4 -EXTRA_5 -EXTRA_6 -EXTRA_7 -SUICIDED
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    FX                  = INITIAL FX_MercenaryDie
  End
  Behavior = SlowDeathBehavior ModuleTag_Death02
    DeathTypes          = NONE +CRUSHED +SPLATTED
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    FX                  = INITIAL FX_GIDieCrushed
  End
  Behavior = SlowDeathBehavior ModuleTag_Death03
    DeathTypes          = NONE +EXPLODED
