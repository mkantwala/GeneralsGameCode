      Animation           = UIMerc_SKL.UIMerc_RNA 25
      AnimationMode       = LOOP
      HideSubObject       = HEAD01 WPN01 WPN02 GLASSES
      Flags               = RANDOMSTART
      TransitionKey       = TRANS_RIDER2_MOVING
