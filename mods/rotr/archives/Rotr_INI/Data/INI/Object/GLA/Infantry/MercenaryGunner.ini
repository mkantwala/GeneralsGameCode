    End
    AliasConditionState = RIDER1 PARACHUTING REALLYDAMAGED
    AliasConditionState = RIDER1 PARACHUTING DYING
    
    TransitionState     = TRANS_RIDER1_Falling TRANS_RIDER1_Chute
