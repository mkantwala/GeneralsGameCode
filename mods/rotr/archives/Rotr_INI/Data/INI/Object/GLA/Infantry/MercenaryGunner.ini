      Animation = UIMerc_SKL.UIMerc_ATB
      AnimationMode = ONCE
      HideSubObject = HEAD01 WPN01 WPN02 GLASSES
    End

    TransitionState = TRANS_RIDER2_START_FIRING TRANS_RIDER2_STANDING
      Model = EIMerc_SKN_C
      Animation = UIMerc_SKL.UIMerc_ATB
      AnimationMode = ONCE
      HideSubObject = HEAD01 WPN01 WPN02 GLASSES
    End
    
    ; ---- dying 
