      Animation = UIMerc_SKL.UIMerc_ATB
      AnimationMode = ONCE
      HideSubObject = HEAD01 WPN01 WPN02 GLASSES
      TransitionKey = TRANS_RIDER2_START_FIRING
    End
    AliasConditionState = RIDER2 FIRING_A REALLYDAMAGED
    
    ConditionState = RIDER2 USING_WEAPON_A
