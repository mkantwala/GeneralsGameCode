; TheSuperHackers @feature Adds a buildable Russia Tu-160 White Swan bomber.
; Reuses the stock FOAB aircraft's model without modifying the support aircraft.
Object RussiaJetTu160Bomber

  SelectPortrait = SSFOAB
  ButtonImage = SSFOAB
  Scale = 0.70

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ParticlesAttachedToAnimatedBones = Yes

    DefaultConditionState
      Model = RVTU160
      WeaponLaunchBone = PRIMARY WeaponA01
    End

    ConditionState = JETEXHAUST
      Model = RVTU160
      WeaponLaunchBone = PRIMARY WeaponA01
      ParticleSysBone = ENGINE01 JetBlackTrailThin
      ParticleSysBone = ENGINE02 JetBlackTrailThin
      ParticleSysBone = ENGINE03 JetBlackTrailThin
      ParticleSysBone = ENGINE04 JetBlackTrailThin
      ParticleSysBone = WINGTIP01 JetContrailThin
      ParticleSysBone = WINGTIP02 JetContrailThin
    End

    ConditionState = DAMAGED
      Model = RVTU160_D
      WeaponLaunchBone = PRIMARY WeaponA01
      ParticleSysBone = SMOKE01 JetSmoke
      ParticleSysBone = SMOKE02 JetSmoke
    End

    ConditionState = DAMAGED JETEXHAUST
      Model = RVTU160_D
      WeaponLaunchBone = PRIMARY WeaponA01
      ParticleSysBone = ENGINE01 JetBlackTrailThin
      ParticleSysBone = ENGINE02 JetBlackTrailThin
      ParticleSysBone = ENGINE03 JetBlackTrailThin
      ParticleSysBone = ENGINE04 JetBlackTrailThin
      ParticleSysBone = WINGTIP01 JetContrailThin
      ParticleSysBone = WINGTIP02 JetContrailThin
      ParticleSysBone = SMOKE01 JetSmoke
      ParticleSysBone = SMOKE02 JetSmoke
    End

    ConditionState = REALLYDAMAGED
      Model = RVTU160_D
      WeaponLaunchBone = PRIMARY WeaponA01
      ParticleSysBone = SMOKE01 JetSmoke
      ParticleSysBone = SMOKE02 JetSmoke
      ParticleSysBone = SMOKE01 FireSmallContinuous
      ParticleSysBone = SMOKE02 FireSmallContinuous
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = RVTU160_D
      WeaponLaunchBone = PRIMARY WeaponA01
      ParticleSysBone = ENGINE01 JetBlackTrailThin
      ParticleSysBone = ENGINE02 JetBlackTrailThin
      ParticleSysBone = ENGINE03 JetBlackTrailThin
      ParticleSysBone = ENGINE04 JetBlackTrailThin
      ParticleSysBone = WINGTIP01 JetContrailThin
      ParticleSysBone = WINGTIP02 JetContrailThin
      ParticleSysBone = SMOKE01 JetSmoke
      ParticleSysBone = SMOKE02 JetSmoke
      ParticleSysBone = SMOKE01 FireSmallContinuous
      ParticleSysBone = SMOKE02 FireSmallContinuous
    End

    ConditionState = RUBBLE
      Model = RVTU160_D1
      ParticleSysBone = SMOKE01 JetSmoke
      ParticleSysBone = SMOKE02 JetSmoke
      ParticleSysBone = SMOKE01 FireSmallContinuous
      ParticleSysBone = SMOKE02 FireSmallContinuous
    End
  End

  DisplayName = OBJECT:RussiaTu160Bomber
  EditorSorting = VEHICLE
  Side = Russia
  TransportSlotCount = 0
  VisionRange = 300.0
  ShroudClearingRange = 300.0
  Prerequisites
    Object = RussiaAirfield
    Object = RussiaIndustrialSite
  End
  BuildCost = 2800
  BuildTime = 35.0
  WeaponSet
    Conditions = None
    Weapon = PRIMARY RussiaTu160BombWeapon
  End
  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End
  ExperienceValue = 200 200 400 400
  ExperienceRequired = 0 200 400 800
  IsTrainable = Yes
  CrusherLevel = 1
  CrushableLevel = 2
  CommandSet = RussiaJetTu160BomberCommandSet

  ; Reuse Russian aircraft voice lines and the stock Tu-160 engine loop.
  VoiceSelect = SokolVoiceSelect
  VoiceMove = SokolVoiceMove
  VoiceAttack = SokolVoiceAttack
  VoiceGuard = SokolVoiceAirPatrol
  SoundAmbient = Tu160AmbientLoop
  SoundAmbientRubble = NoSound
  UnitSpecificSounds
    VoiceCreate = SokolVoiceCreate
    VoiceLowFuel = SokolVoiceLowFuel
    VoiceGarrison = SokolVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body = ActiveBody ModuleTag_02
    MaxHealth = 220.0
    InitialHealth = 220.0
    SubdualDamageCap = 900
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior                          = JetSlowDeathBehavior ModuleTag_03
    FXOnGroundDeath                 = FX_JetOnGroundDeath
    DestructionDelay                = 5000
    RollRate                        = 0.2
    RollRateDelta                   = 100% ;each frame, rollrate = rollrate * rollrateDelta
    PitchRate                       = 0.0
    FallHowFast                     = 110.0%  ;Bigger is faster (can be over 100%,it's a fraction of gravity)
    FXInitialDeath                  = FX_AuroraDeathInitial
    DelaySecondaryFromInitialDeath  = 500  ; in milliseconds
    FXSecondary                     = FX_JetDeathSecondary
    FXHitGround                     = FX_JetDeathHitGround
    DelayFinalBlowUpFromHitGround   = 200 ; in milliseconds
    FXFinalBlowUp                   = FX_JetDeathFinalBlowUp
  End
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 500.0
  End

  Behavior = JetAIUpdate ModuleTag_07
    OutOfAmmoDamagePerSecond = 10%
    TakeoffDistForMaxLift = 0%
    TakeoffPause = 500
    MinHeight = 5
    ParkingOffset = 3
    AttackLocomotorType = SET_SUPERSONIC
    AttackLocomotorPersistTime = 100
    ; This locomotor set only changes speed: no Aurora targeting protection.
    SneakyOffsetWhenAttacking = 0
    AttackersMissPersistTime = 0
    ReturnForAmmoLocomotorType = SET_SLUGGISH
    ReturnToBaseIdleTime = 10000
  End
  Locomotor = SET_NORMAL RussiaTu160CruiseLocomotor
  Locomotor = SET_SUPERSONIC RussiaTu160AttackLocomotor
  Locomotor = SET_SLUGGISH RussiaTu160ReturnLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End
  Behavior = TransitionDamageFX ModuleTag_22
    ReallyDamagedParticleSystem1 = Bone:Smoke01 RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End
  Behavior = FireWeaponCollide ModuleTag_AircraftCrateCollide01
    CollideWeapon = AircraftCratePickupDummySpawner
    RequiredStatus = IS_CARBOMB
  End

  Geometry = Box
  GeometryIsSmall = Yes
  GeometryMajorRadius = 20.0
  GeometryMinorRadius = 5.0
  GeometryHeight = 5.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
