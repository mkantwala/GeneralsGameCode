;------------------------------------------------------------------------------
Object RussiaVehicleBMD1

  ; *** ART Parameters ***
  SelectPortrait         = SRBMD1_L
  ButtonImage            = SRBMD1
  
  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
    MaxRecoilDistance    = 3
    RecoilSettleSpeed    = 4

    ConditionState = NONE
      Model = RVBMD1
      Turret = Turret
      HideSubObject = TurretUP
      WeaponMuzzleFlash   = SECONDARY MuzzleMGFX
      WeaponFireFXBone    = SECONDARY MuzzleMG
      WeaponLaunchBone    = SECONDARY MuzzleMG
      WeaponRecoilBone    = TERTIARY Barrel
      WeaponMuzzleFlash   = TERTIARY MuzzleFX
      WeaponFireFXBone    = TERTIARY Muzzle
      WeaponLaunchBone    = TERTIARY Muzzle
    End
    AliasConditionState = NIGHT
    AliasConditionState = ATTACKING
    AliasConditionState = NIGHT ATTACKING
    AliasConditionState = SNOW
    AliasConditionState = SNOW NIGHT
    AliasConditionState = SNOW ATTACKING
    AliasConditionState = SNOW NIGHT ATTACKING
    
    ;;when upgraded with mortar turret
    ConditionState = WEAPONSET_PLAYER_UPGRADE
      Model = RVBMD1
      Animation = RVBMD1.RVBMD1
      AnimationMode = ONCE_BACKWARDS
      Flags = START_FRAME_FIRST
      TransitionKey = TRANS_MORTAR_IDLE
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    AliasConditionState = SNOW WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = NIGHT WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = NIGHT SNOW WEAPONSET_PLAYER_UPGRADE
    
    TransitionState = TRANS_MORTAR_IDLE TRANS_MORTAR_FIRING
      Model = RVBMD1
      Animation = RVBMD1.RVBMD1
      AnimationMode = ONCE
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    
    ConditionState = WEAPONSET_PLAYER_UPGRADE ATTACKING
      Model = RVBMD1
      Animation = RVBMD1.RVBMD1
      AnimationMode = ONCE
      Flags = START_FRAME_LAST
      TransitionKey = TRANS_MORTAR_FIRING
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    AliasConditionState = SNOW WEAPONSET_PLAYER_UPGRADE ATTACKING
    AliasConditionState = NIGHT WEAPONSET_PLAYER_UPGRADE ATTACKING
    AliasConditionState = NIGHT SNOW WEAPONSET_PLAYER_UPGRADE ATTACKING
    
    TransitionState = TRANS_MORTAR_FIRING TRANS_MORTAR_IDLE
      Model = RVBMD1
      Animation = RVBMD1.RVBMD1
      AnimationMode = ONCE_BACKWARDS
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    
    ;;Damaged
    
    ConditionState = REALLYDAMAGED 
      Model = RVBMD1_D
      Turret = Turret
      HideSubObject = TurretUP
      WeaponMuzzleFlash   = SECONDARY MuzzleMGFX
      WeaponFireFXBone    = SECONDARY MuzzleMG
      WeaponLaunchBone    = SECONDARY MuzzleMG
      WeaponRecoilBone    = TERTIARY Barrel
      WeaponMuzzleFlash   = TERTIARY MuzzleFX
      WeaponFireFXBone    = TERTIARY Muzzle
      WeaponLaunchBone    = TERTIARY Muzzle
    End
    AliasConditionState = REALLYDAMAGED NIGHT
    AliasConditionState = REALLYDAMAGED ATTACKING
    AliasConditionState = REALLYDAMAGED NIGHT ATTACKING
    AliasConditionState = REALLYDAMAGED SNOW
    AliasConditionState = REALLYDAMAGED SNOW NIGHT
    AliasConditionState = REALLYDAMAGED SNOW ATTACKING
    AliasConditionState = REALLYDAMAGED SNOW NIGHT ATTACKING
    AliasConditionState = RUBBLE
    AliasConditionState = RUBBLE NIGHT
    AliasConditionState = RUBBLE SNOW
    AliasConditionState = RUBBLE SNOW NIGHT
    
    ;;when upgraded with mortar turret
    ConditionState = REALLYDAMAGED WEAPONSET_PLAYER_UPGRADE
      Model = RVBMD1_D
      Animation = RVBMD1_D.RVBMD1_D
      AnimationMode = ONCE_BACKWARDS
      Flags = START_FRAME_FIRST
      TransitionKey = TRANS_DAMAGED_MORTAR_IDLE
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    AliasConditionState = REALLYDAMAGED SNOW WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = REALLYDAMAGED NIGHT WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = REALLYDAMAGED NIGHT SNOW WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = RUBBLE WEAPONSET_PLAYER_UPGRADE
    AliasConditionState = RUBBLE WEAPONSET_PLAYER_UPGRADE NIGHT
    AliasConditionState = RUBBLE WEAPONSET_PLAYER_UPGRADE SNOW
    AliasConditionState = RUBBLE WEAPONSET_PLAYER_UPGRADE SNOW NIGHT
    
    TransitionState = TRANS_DAMAGED_MORTAR_IDLE TRANS_DAMAGED_MORTAR_FIRING
      Model = RVBMD1_D
      Animation = RVBMD1_D.RVBMD1_D
      AnimationMode = ONCE
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    
    ConditionState = REALLYDAMAGED WEAPONSET_PLAYER_UPGRADE ATTACKING
      Model = RVBMD1_D
      Animation = RVBMD1_D.RVBMD1_D
      AnimationMode = ONCE
      Flags = START_FRAME_LAST
      TransitionKey = TRANS_DAMAGED_MORTAR_FIRING
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    AliasConditionState = REALLYDAMAGED SNOW WEAPONSET_PLAYER_UPGRADE ATTACKING
    AliasConditionState = REALLYDAMAGED NIGHT WEAPONSET_PLAYER_UPGRADE ATTACKING
    AliasConditionState = REALLYDAMAGED NIGHT SNOW WEAPONSET_PLAYER_UPGRADE ATTACKING
    
    TransitionState = TRANS_DAMAGED_MORTAR_FIRING TRANS_DAMAGED_MORTAR_IDLE
      Model = RVBMD1_D
      Animation = RVBMD1_D.RVBMD1_D
      AnimationMode = ONCE_BACKWARDS
      Flags = MAINTAIN_FRAME_ACROSS_STATES
      Turret = TurretUp
      HideSubObject = Turret
      ShowSubObject = TurretUP
      WeaponRecoilBone = SECONDARY BarrelUp
      WeaponFireFXBone = SECONDARY MuzzleUp
      WeaponLaunchBone = SECONDARY MuzzleUp
    End
    
    
    TrackMarks             = EXTnkTrack.tga
    TreadAnimationRate      = 2.0  ;  amount of tread texture to move per second
    TreadDriveSpeedFraction = 0.3  ; fraction of locomotor speed below which treads stop moving.
    TreadPivotSpeedFraction = 0.6  ; fraction of locomotor speed below which we allow pivoting.
  End
  
  
  Draw = W3DModelDraw ModuleTag_Headlights01
    OkToChangeModelColor = Yes

   DefaultConditionState
      Model = RVBMD1_N
      Turret = Turret
    End
    AliasConditionState = REALLYDAMAGED
    AliasConditionState = RUBBLE
    
    ConditionState = WEAPONSET_PLAYER_UPGRADE
      Model = RVBMD1_N2
      Turret = TurretUp
    End    
    AliasConditionState = WEAPONSET_PLAYER_UPGRADE REALLYDAMAGED
    AliasConditionState = WEAPONSET_PLAYER_UPGRADE RUBBLE
    
  End
  
  Draw = W3DModelDraw ModuleMod_OverWater
    DefaultConditionState
      Model = NVTCrawler_W
    End
    AliasConditionState  = MOVING
    ConditionState       = OVER_WATER
      ParticleSysBone    = TreadFX01 AmphibWaveRest
      ParticleSysBone    = TreadFX02 AmphibWaveRest
    End   
    ConditionState       = OVER_WATER MOVING
      ParticleSysBone    = TreadFX01 AmphibWave
      ParticleSysBone    = TreadFX02 AmphibWave
    End
  End
  
  Draw = W3DModelDraw ModuleTag_ParachutePlate01
  
    DefaultConditionState
      Model             = NONE
    End
    AliasConditionState = REALLYDAMAGED
    AliasConditionState = RUBBLE
  
    ConditionState = FREEFALL
      Model             = RVParaPlate
    End
    AliasConditionState = FREEFALL REALLYDAMAGED
    AliasConditionState = FREEFALL RUBBLE
    AliasConditionState = PARACHUTING
    AliasConditionState = PARACHUTING REALLYDAMAGED
    AliasConditionState = PARACHUTING RUBBLE
    
  End

  Draw = W3DModelDraw ModuleMod_ExitBones
  
    DefaultConditionState
      Model = RVBMP3_B
    End
    
  End
  
  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:BMD1
  Side                  = Russia
  EditorSorting         = VEHICLE
  TransportSlotCount    = 3                 ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet
    Conditions = None 
    Weapon     = PRIMARY   BMP3DummyWeapon
    Weapon     = SECONDARY BMP3Autocannon
    Weapon     = TERTIARY  BMP3AntiTankGun
  End
  
  WeaponSet
    Conditions = HERO 
    Weapon     = PRIMARY   BMP3DummyWeapon
    Weapon     = SECONDARY BMP3AutocannonHeroic
    Weapon     = TERTIARY  HeroicBMP3AntiTankGun
  End
  
  WeaponSet
    Conditions = PLAYER_UPGRADE 
    Weapon     = PRIMARY   BMDMortarCannonDummyWeapon
    Weapon     = SECONDARY BMDMortarCannonGun
  End
  
  WeaponSet
    Conditions = HERO PLAYER_UPGRADE 
    Weapon     = PRIMARY   BMDMortarCannonDummyWeapon
    Weapon     = SECONDARY BMDMortarCannonGun
  End

  ArmorSet
    Conditions        = None
    Armor             = TankArmor
    DamageFX          = TankDamageFX
  End
  
  BuildCost       = 700
  BuildTime       = 9.0          ;in seconds    
  VisionRange     = 200
  ShroudClearingRange = 200
  
  Prerequisites
    Object = RussiaWarFactory
  End
  
  ExperienceValue    = 50 50  100 150  ;Experience point value at each level
  ExperienceRequired = 0  100 200 300  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  
  CommandSet      = RussianVehicleBMD1CommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect    = BMDVoiceSelect
  VoiceMove      = BMDVoiceMove
  VoiceGuard     = BMDVoiceMove
  VoiceAttack    = BMDVoiceAttack
  SoundMoveStart        = BMP3MoveStart
  SoundMoveStartDamaged = BMP3MoveStart
  SoundEnter = HumveeEnter
  SoundExit  = HumveeExit

  UnitSpecificSounds
    VoiceCreate = BMDVoiceCreate
    VoiceCrush  = BMDVoiceMove
    VoiceUnload = BMDVoiceUnload
    VoiceEnter  = BMDVoiceMove
  End


  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE TRANSPORT

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 300.0
    InitialHealth   = 300.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 600
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  
  Behavior = TransportAIUpdate ModuleTag_03
    Turret
      TurretTurnRate = 180
      RecenterTime = 5000   ; how long to wait during idle before recentering
      MinIdleScanAngle      = 10
      MaxIdleScanAngle      = 40
      MinIdleScanInterval   = 5000
      MaxIdleScanInterval   = 10000
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    TurretsLinked = Yes
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate        = 250
  End
  
  Locomotor = SET_NORMAL BMD4Locomotor TroopCrawlerWaterLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 50.0
  End

  Behavior = TransportContain  ModuleTag_05
    Slots                = 5
    EnterSound           = GarrisonEnter
    ExitSound            = GarrisonExit
    DamagePercentToUnits = 0%
    AllowInsideKindOf    = INFANTRY
    ExitDelay            = 250
    NumberOfExitPaths    = 3
    GoAggressiveOnExit   = Yes ; AI Will tell people to set their mood to Aggressive on exiting
  End
    
  Behavior = ProductionUpdate ModuleTag_Production01
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  
  Behavior = WeaponSetUpgrade ModuleTag_Mortar01
    TriggeredBy   = Upgrade_GLAWorkerFakeCommandSet
  End
  
  Behavior = SlowDeathBehavior ModuleTag_11
    DeathTypes = ALL -CRUSHED -SPLATTED
    DestructionDelay = 1
    FX  = FINAL    FX_BattleMasterExplosionOneFinal
    OCL = FINAL    OCL_FinalBMD1Debris
  End

  Behavior = DestroyDie ModuleTag_12
    DeathTypes = NONE +CRUSHED +SPLATTED
  End

  Behavior = FXListDie ModuleTag_13
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = CreateCrateDie ModuleTag_CratesChange
    CrateData = SalvageCrateData
  End

  Behavior = TransitionDamageFX ModuleTag_17
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  
  Behavior = StealthUpdate ModuleTag_GPSStealth01
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = FIRING_PRIMARY FIRING_SECONDARY FIRING_TERTIARY RIDERS_ATTACKING
    InnateStealth               = Yes
    RequiredStatus              = REASSIGN_PARKING ;Used exclusively by the GPS Scrambler
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End

  Behavior = EjectPilotDie ModuleTag_HijackerEmerge01
    DeathTypes = ALL -CRUSHED -SPLATTED
    RequiredStatus = HIJACKED
    VeterancyLevels =  ALL
    GroundCreationList = OCL_HijackerEmerge
    AirCreationList = OCL_HijackerEmergeViaParachute
  End
  
  Behavior = FXListDie ModuleTag_HijackerEmerge02
    RequiredStatus = HIJACKED
    DeathTypes = ALL -CRUSHED -SPLATTED
    DeathFX = FX_HijackerEmerge
  End
  
  ;Smoke grenades
  Behavior           = OCLSpecialPower ModuleTag_SmokeGrenade01
    SpecialPowerTemplate = SpecialAbilityRussianSmokeGrenades
    OCL                  = OCL_UniversalAbbilityTrigger
    CreateLocation       = USE_OWNER_OBJECT
  End
  
  Behavior = FireWeaponCollide ModuleTag_SmokeGrenade02
    CollideWeapon  = RussianSmokeGrenadeLaunchWeapon
    RequiredStatus = USING_ABILITY
  End

  Geometry = BOX
  GeometryMajorRadius = 15.5
  GeometryMinorRadius = 8.5
  GeometryHeight = 11.5     
  GeometryIsSmall = Yes 
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End