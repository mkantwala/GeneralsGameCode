;------------------------------------------------------------------------------
Object ChinaVehicleNukeLauncher

  ; *** ART Parameters ***
  SelectPortrait         = SNNukeCannon_L
  ButtonImage            = SNNukeCannon
  
  UpgradeCameo1 = Upgrade_Nationalism

  Draw = W3DTankDraw ModuleTag_01
    
    InitialRecoilSpeed   = 120
    MaxRecoilDistance    = 8
    RecoilSettleSpeed    = 6

    OkToChangeModelColor = Yes

    ExtraPublicBone = Turret01

    DefaultConditionState
      Model                           = NVNukeCn
      WeaponMuzzleFlash               = SECONDARY MuzzleFX
      Turret                          = Turret
      WeaponLaunchBone                = PRIMARY Muzzle
      WeaponFireFXBone                = PRIMARY Muzzle
    End
    AliasConditionState = RIDER1
    AliasConditionState = RIDER2

    ;*** PACKED STATE -- ready to move ***
    ConditionState    = MOVING
      Animation       = NVNukeCn.NVNukeCn
      AnimationMode   = ONCE_BACKWARDS
      Flags           = START_FRAME_FIRST
    End
    AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER1 MOVING
    AliasConditionState = RIDER1 MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER2 MOVING
    AliasConditionState = RIDER2 MOVING BETWEEN_FIRING_SHOTS_A    
    
    ;*** UNPACKING STATE  -- preparing to fire ***
    ConditionState    = UNPACKING
      Animation       = NVNukeCn.NVNukeCn
      AnimationMode   = MANUAL
    End
    AliasConditionState = UNPACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER1 UNPACKING
    AliasConditionState = RIDER1 UNPACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER2 UNPACKING
    AliasConditionState = RIDER2 UNPACKING BETWEEN_FIRING_SHOTS_A
    
    ;*** PACKING STATE -- preparing to move ***
    ConditionState    = PACKING
      Animation       = NVNukeCn.NVNukeCn
      AnimationMode   = MANUAL
    End
    AliasConditionState = PACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER1 PACKING
    AliasConditionState = RIDER1 PACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER2 PACKING
    AliasConditionState = RIDER2 PACKING BETWEEN_FIRING_SHOTS_A

    ;*** DEPLOYED STATE -- ready to fire ***
    ConditionState    = DEPLOYED 
      Animation       = NVNukeCn.NVNukeCn
      AnimationMode   = ONCE
      Flags           = START_FRAME_LAST
    End
    AliasConditionState = DEPLOYED MOVING
    AliasConditionState = RIDER1 DEPLOYED
    AliasConditionState = RIDER1 DEPLOYED MOVING
    
    ConditionState    = DEPLOYED FIRING_A
      Model           = NVNukeCn_A
      Animation       = NVNukeCn_A.NVNukeCn_A
      AnimationMode   = ONCE
      Flags           = START_FRAME_FIRST
      Turret            = Turret
      WeaponMuzzleFlash = PRIMARY MuzzleFX
      ;WeaponRecoilBone  = PRIMARY Barrel
      WeaponMuzzleFlash = SECONDARY NONE
    End
    AliasConditionState = RIDER1 DEPLOYED FIRING_A
    
    ConditionState    = DEPLOYED BETWEEN_FIRING_SHOTS_A
      Model           = NVNukeCn_A
      Animation       = NVNukeCn_A.NVNukeCn_A
      AnimationMode   = ONCE
      Flags           = MAINTAIN_FRAME_ACROSS_STATES
    End
    AliasConditionState = DEPLOYED RELOADING_A
    AliasConditionState = RIDER1 DEPLOYED BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER1 DEPLOYED RELOADING_A
    
    ConditionState    = RIDER2 DEPLOYED 
      Animation       = NVNukeCn.NVNukeCn
      AnimationMode   = ONCE
      Flags           = START_FRAME_LAST
    End
    AliasConditionState = RIDER2 DEPLOYED BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RIDER2 DEPLOYED RELOADING_A
    AliasConditionState = RIDER2 DEPLOYED MOVING    
    AliasConditionState = RIDER2 DEPLOYED FIRING_A
    
    
    ;Reallydamaged conditions
    
    ConditionState    = REALLYDAMAGED
      Model           = NVNukeCn_D
    End
    AliasConditionState = REALLYDAMAGED RIDER1
    AliasConditionState = REALLYDAMAGED RIDER2

    ;*** PACKED STATE -- ready to move ***
    ConditionState    = REALLYDAMAGED MOVING
      Model           = NVNukeCn_D
      Animation       = NVNukeCn_D.NVNukeCn_D
      AnimationMode   = ONCE_BACKWARDS
      Flags           = START_FRAME_FIRST
    End
    AliasConditionState = REALLYDAMAGED MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER1 MOVING
    AliasConditionState = REALLYDAMAGED RIDER1 MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER2 MOVING
    AliasConditionState = REALLYDAMAGED RIDER2 MOVING BETWEEN_FIRING_SHOTS_A    
    
    ;*** UNPACKING STATE  -- preparing to fire ***
    ConditionState    = REALLYDAMAGED UNPACKING
      Model           = NVNukeCn_D
      Animation       = NVNukeCn_D.NVNukeCn_D
      AnimationMode   = MANUAL
    End
    AliasConditionState = REALLYDAMAGED UNPACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER1 UNPACKING
    AliasConditionState = REALLYDAMAGED RIDER1 UNPACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER2 UNPACKING
    AliasConditionState = REALLYDAMAGED RIDER2 UNPACKING BETWEEN_FIRING_SHOTS_A
    
    ;*** PACKING STATE -- preparing to move ***
    ConditionState    = REALLYDAMAGED PACKING
      Model           = NVNukeCn_D
      Animation       = NVNukeCn_D.NVNukeCn_D
      AnimationMode   = MANUAL
    End
    AliasConditionState = REALLYDAMAGED PACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER1 PACKING
    AliasConditionState = REALLYDAMAGED RIDER1 PACKING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER2 PACKING
    AliasConditionState = REALLYDAMAGED RIDER2 PACKING BETWEEN_FIRING_SHOTS_A
    

    ;*** DEPLOYED STATE -- ready to fire ***
    ConditionState    = REALLYDAMAGED DEPLOYED 
      Model           = NVNukeCn_D
      Animation       = NVNukeCn_D.NVNukeCn_D
      AnimationMode   = ONCE
      Flags           = START_FRAME_LAST
      WaitForStateToFinishIfPossible = TRANS_DAMAGED_FIRING
    End
    AliasConditionState = REALLYDAMAGED DEPLOYED MOVING
    AliasConditionState = REALLYDAMAGED RIDER1 DEPLOYED
    AliasConditionState = REALLYDAMAGED RIDER1 DEPLOYED MOVING
    
    ConditionState    = REALLYDAMAGED DEPLOYED FIRING_A
      Model           = NVNukeCn_AD
      Animation       = NVNukeCn_AD.NVNukeCn_AD
      AnimationMode   = ONCE
      Flags           = START_FRAME_FIRST
      Turret            = Turret
      WeaponMuzzleFlash = PRIMARY MuzzleFX
      WeaponRecoilBone  = PRIMARY Barrel
      WeaponMuzzleFlash = SECONDARY NONE
    End
    AliasConditionState = REALLYDAMAGED RIDER1 DEPLOYED FIRING_A
    
    ConditionState    = REALLYDAMAGED DEPLOYED BETWEEN_FIRING_SHOTS_A
      Model           = NVNukeCn_AD
      Animation       = NVNukeCn_AD.NVNukeCn_AD
      AnimationMode   = ONCE
      Flags           = MAINTAIN_FRAME_ACROSS_STATES
    End
    AliasConditionState = REALLYDAMAGED DEPLOYED RELOADING_A
    AliasConditionState = REALLYDAMAGED RIDER1 DEPLOYED BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER1 DEPLOYED RELOADING_A
    
    ConditionState    = REALLYDAMAGED RIDER2 DEPLOYED 
      Model           = NVNukeCn_D
      Animation       = NVNukeCn_D.NVNukeCn_D
      AnimationMode   = ONCE
      Flags           = START_FRAME_LAST
    End
    AliasConditionState = REALLYDAMAGED RIDER2 DEPLOYED BETWEEN_FIRING_SHOTS_A
    AliasConditionState = REALLYDAMAGED RIDER2 DEPLOYED RELOADING_A
    AliasConditionState = REALLYDAMAGED RIDER2 DEPLOYED MOVING    
    AliasConditionState = REALLYDAMAGED RIDER2 DEPLOYED FIRING_A    
    
      
    ConditionState                    = RUBBLE
      Model                           = NVNukeCn_D1
    End
    
    TrackMarks              = EXTnkTrack.tga
    TreadAnimationRate      = 4.0  ; amount of tread texture to move per second
  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:NukeLauncher
  Side = China
  EditorSorting   = VEHICLE
  TransportSlotCount = 10                 ;how many "slots" we take in a transport (0 == not transportable)
  
  WeaponSet
    Conditions = WEAPON_RIDER1    
    Weapon              = PRIMARY   NukeCannonGun
    Weapon              = TERTIARY  NukeCannonDummyDeployWeapon
    AutoChooseSources   = TERTIARY  NONE    
  End
  
  WeaponSet
    Conditions = WEAPON_RIDER2
    Weapon              = PRIMARY   NukeCannonGunHoldFireDummy
    AutoChooseSources   = PRIMARY   NONE   
    Weapon              = TERTIARY  NukeCannonDummyDeployWeapon
    AutoChooseSources   = TERTIARY  NONE    
  End

  
  ArmorSet
    Conditions      = None
    Armor           = BikeLogicTankArmor
    DamageFX        = TankDamageFX
  End
  BuildCost       = 2000
  BuildTime       = 18.0          ;in seconds    
  VisionRange     = 400
  ShroudClearingRange = 200
  
  Prerequisites
    Object = ChinaWarFactory
    Object = ChinaBreederReactor
    Science = SCIENCE_TacticalNukes
  End

  ExperienceValue = 50 100 200 400    ;Experience point value at each level
  ExperienceRequired = 0 400 600 1000  ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles

  ; *** AUDIO Parameters ***
  VoiceSelect           = NukeCannonVoiceSelect
  VoiceMove             = NukeCannonVoiceMove
  VoiceGuard            = NukeCannonVoiceMove
  VoiceAttack           = NukeCannonVoiceAttack
  SoundMoveStart        = NukeCannonMoveStart
  SoundMoveStartDamaged = NukeCannonMoveStart
  
  UnitSpecificSounds
    VoiceCreate         = NukeCannonVoiceCreate
    TurretMoveLoop      = NukeCannonTurretMoveLoop
    VoiceEnter          = NukeCannonVoiceMove
    Deploy              = NukeCannonDeploy
    Undeploy            = NukeCannonUnDeploy
  End


  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS VEHICLE SCORE GARRISONABLE_UNTIL_DESTROYED
  
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 240.0
    InitialHealth   = 240.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 480
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = DeployStyleAIUpdate ModuleTag_04
    Turret
      TurretTurnRate        = 80
      TurretPitchRate       = 80
      FirePitch             = 0            ; Instead of aiming pitchwise at the target, it will aim here
      AllowsPitch           = Yes
      RecenterTime          = 5000         ; how long to wait during idle before recentering
      MinIdleScanAngle      = 10
      MaxIdleScanAngle      = 40
      MinIdleScanInterval   = 5000
      MaxIdleScanInterval   = 10000
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
      NaturalTurretAngle    = 0
      InitiallyDisabled     = Yes
    End
    AutoAcquireEnemiesWhenIdle = Yes NotWhileAttacking ;No they now auto accuire targets set them to hold fire you don't want them to fire
    PackTime = 2310
    UnpackTime = 2310
    TurretsFunctionOnlyWhenDeployed = Yes
    TurretsMustCenterBeforePacking = Yes
    ManualDeployAnimations = Yes
  End
  Locomotor = SET_NORMAL ChinaNukeCannonLocomotor
  
  ;*************************************
  ;******Transformation Code Start******
  ;*************************************
  
  Behavior = RiderChangeContain ModuleTag_Transform01

    ;;;;Normal Rank
    Rider1 = GenericFakeRider1_Default_Rank  RIDER1 WEAPON_RIDER1 STATUS_RIDER1 ChinaVehicleNukeCannonCommandSet SET_NORMAL
    Rider2 = GenericFakeRider2_Default_Rank RIDER2 WEAPON_RIDER2 STATUS_RIDER2 ChinaVehicleNukeCannonCommandSet SET_NORMAL

    ;;;;Veteran Rank 
    Rider3 = GenericFakeRider1_Veteran_Rank  RIDER1 WEAPON_RIDER1 STATUS_RIDER1 ChinaVehicleNukeCannonCommandSet SET_NORMAL
    Rider4 = GenericFakeRider2_Veteran_Rank RIDER2 WEAPON_RIDER2 STATUS_RIDER2 ChinaVehicleNukeCannonCommandSet SET_NORMAL

    ;;;;Elite Rank
    Rider5 = GenericFakeRider1_Elite_Rank    RIDER1 WEAPON_RIDER1 STATUS_RIDER1 ChinaVehicleNukeCannonCommandSet SET_NORMAL
    Rider6 = GenericFakeRider2_Elite_Rank   RIDER2 WEAPON_RIDER2 STATUS_RIDER2 ChinaVehicleNukeCannonCommandSet SET_NORMAL

    ;;;;Heroic Rank
    Rider7 = GenericFakeRider1_Heroic_Rank   RIDER1 WEAPON_RIDER1 STATUS_RIDER1 ChinaVehicleNukeCannonCommandSet SET_NORMAL
    Rider8 = GenericFakeRider2_Heroic_Rank  RIDER2 WEAPON_RIDER2 STATUS_RIDER2 ChinaVehicleNukeCannonCommandSet SET_NORMAL

    ;Standard TransportContain stuff
    Slots                 = 1
    InitialPayload        = GenericFakeRider1_Default_Rank 1
    DamagePercentToUnits  = 100%
    BurnedDeathToUnits    = No
    AllowInsideKindOf     = CAN_ATTACK    
    ScuttleDelay          = 100
    ScuttleStatus         = TOPPLED
  End  
  
  Behavior = GrantUpgradeCreate ModuleTag_Transform02
    UpgradeToGrant     = Upgrade_GLAWorkerRealCommandSet
  End

  Behavior = ProductionUpdate  ModuleTag_Transform03
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End

  Behavior = ObjectCreationUpgrade ModuleTag_Transform04
    UpgradeObject   = OCL_NukeCannonFreeFireMode
    TriggeredBy     = Upgrade_GLAWorkerRealCommandSet
  End 
  
  Behavior = FireWeaponCollide ModuleTag_Transform05
    CollideWeapon   = GrenadierSwitchToHighExplosiveRounds
    RequiredStatus  = STATUS_RIDER8
  End
  
  Behavior = ObjectCreationUpgrade ModuleTag_Transform06
    UpgradeObject   = OCL_NukeCannonHoldFireMode
    TriggeredBy     = Upgrade_GLAWorkerFakeCommandSet
  End 
  
  Behavior = FireWeaponCollide  ModuleTag_Transform07
    CollideWeapon   = GrenadierSwitchToHighAirburstRounds
    RequiredStatus  = STATUS_RIDER7
  End
  
  ;************************************
  ;******Transformation Code End*******
  ;************************************
  
  ;This spawns a crate that only bombtrucks can pickup to gain a nuclear payload
  Behavior = CreateCrateDie ModuleTag_NukeCrate01
    CrateData      = NukeCannonWarheadCrateData
  End

  Behavior = FireWeaponCollide ModuleTag_DeployMarkerDecal01
    CollideWeapon  = NukeCannonDeployedDecalWeapon
    RequiredStatus = DEPLOYED
  End

  Behavior = FireWeaponUpdate ModuleTag_DeployMarkerDecal02
    Weapon = GLACommandTruckRadarCollisionDummyWeapon
  End
  
  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 50.0
  End

  Behavior = SlowDeathBehavior ModuleTag_06
    DeathTypes = ALL -CRUSHED -SPLATTED +TOPPLED -EXTRA_7
    DestructionDelay  = 500
    DestructionDelayVariance  = 100
    FX  = INITIAL  FX_BattleMasterExplosionOneFinal
    OCL = INITIAL  OCL_RadiationFieldSmall
    OCL = MIDPOINT OCL_ChinaVehicleNukeCannonDie
    OCL = FINAL    OCL_RadiationFieldSmall
    FX  = FINAL    FX_ChinaVehicleNukeCannonDeathExplosion
  End
  
  ;Deaths for pilot kill weapons
  Behavior = CreateObjectDie ModuleTag_105235
    DeathTypes = NONE +EXTRA_7
    CreationList = OCL_NukeCannonNerveGasKill
    TransferPreviousHealth = Yes
  End
  
  ; A crushing defeat
  Behavior = FXListDie ModuleTag_07
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End
  Behavior = CreateObjectDie ModuleTag_08
    DeathTypes = NONE +CRUSHED +SPLATTED
    CreationList = OCL_CrusaderTank_CrushEffect
  End
  Behavior = CreateCrateDie ModuleTag_09
    CrateData = SalvageCrateDataChinaTier2
    ;CrateData = EliteTankCrateData
    ;CrateData = HeroicTankCrateData
  End

  Behavior                 = TransitionDamageFX ModuleTag_10
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_NukeCannonDamageTransition
  End

  Behavior = DestroyDie ModuleTag_11
    DeathTypes = NONE +CRUSHED +SPLATTED +EXTRA_7
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = ProductionUpdate ModuleTag_12
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  
  Behavior = StealthUpdate ModuleTag_GPSStealth01
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = FIRING_PRIMARY FIRING_SECONDARY FIRING_TERTIARY RIDERS_ATTACKING
    InnateStealth               = Yes
    RequiredStatus              = REASSIGN_PARKING ;Used exclusively by the GPS Scrambler
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End

  Behavior = HordeUpdate ModuleTag_Horde01
    RubOffRadius = 150    ; if I am this close to a real hordesman, I will get to be an honorary hordesman
    UpdateRate = 1000     ; how often to recheck horde status (msec)
    Radius = 75           ; how close other units must be to us to count towards our horde-ness (~30 feet or so)
    KindOf = VEHICLE      ; what KindOf's must match to count towards horde-ness
    AlliesOnly = Yes      ; do we only count allies towards horde status? 
    Count = 5             ; how many units must be within Radius to grant us horde-ness
    Action = HORDE        ; when horde-ing, grant us the HORDE bonus
  End

  Behavior = EjectPilotDie ModuleTag_HijackerEmerge01
    DeathTypes = ALL -CRUSHED -SPLATTED
    RequiredStatus = HIJACKED
    VeterancyLevels =  ALL
    GroundCreationList = OCL_HijackerEmerge
    AirCreationList = OCL_HijackerEmergeViaParachute
  End
  
  Behavior = FXListDie ModuleTag_HijackerEmerge02
    RequiredStatus = HIJACKED
    DeathTypes = ALL -CRUSHED -SPLATTED
    DeathFX = FX_HijackerEmerge
  End
  
  Behavior = CommandButtonHuntUpdate  ModuleTag_Huntin01 ; allows use of command button hunt script with this unit. 
  End

  Geometry = BOX
  GeometryMajorRadius = 32.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 17.0     
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length    

End

;------------------------------------------------------------------------------
Object ChinaVehicleNukeLauncherUnmanned

  SelectPortrait         = SNNukeCannon_L
  ButtonImage            = SNNukeCannon
  
  UpgradeCameo1 = Upgrade_Nationalism
  

  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
    
    ;Normal State
    ConditionState      = NONE
      Model             = NVNukeCn
      WeaponMuzzleFlash = SECONDARY MuzzleFX
    End
    
    ConditionState      = REALLYDAMAGED
      Model             = NVNukeCn_D
      WeaponMuzzleFlash = SECONDARY MuzzleFX
    End
    
    ConditionState = RUBBLE
      Model             = NVNukeCn_D1
      WeaponMuzzleFlash = SECONDARY MuzzleFX
    End
    
    TrackMarks              = EXTnkTrack.tga
    TreadAnimationRate      = 4.0  ; amount of tread texture to move per second
  End

  ; ***DESIGN parameters ***
  DisplayName            = OBJECT:NukeLauncher
  Side                   = China
  EditorSorting          = SYSTEM
  TransportSlotCount     = 3

  
  WeaponSet
    Conditions           = NONE
    Weapon               = PRIMARY   SuicideUnresistableWeapon
  End
  
  ArmorSet
    Conditions           = None
    Armor                = TankArmor
    DamageFX             = UnmannedTankDamageFX
  End

  VisionRange            = 200
  ShroudClearingRange = 200


  IsTrainable            = No
  CrusherLevel           = 2               ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2               ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  
  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE
  
  Body                   = ActiveBody ModuleTag_02
    MaxHealth       = 240.0
    InitialHealth   = 240.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 600
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = No
  End
  Locomotor            = SET_NORMAL   FreeFallLocomotor
  
  Behavior = PhysicsBehavior ModuleTag_04
    Mass                 = 50.0
  End
  
  ; Turret fly off death
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -CRUSHED -SPLATTED -SUICIDED
    DestructionDelay  = 500
    DestructionDelayVariance  = 100
    FX  = INITIAL  FX_BattleMasterExplosionOneFinal
    OCL = INITIAL  OCL_RadiationFieldSmall
    OCL = MIDPOINT OCL_ChinaVehicleNukeCannonDie
    OCL = FINAL    OCL_RadiationFieldSmall
    FX  = FINAL    FX_ChinaVehicleNukeCannonDeathExplosion
  End

  Behavior                 = TransitionDamageFX ModuleTag_12
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End

  Behavior = DestroyDie ModuleTag_11
    DeathTypes = NONE +CRUSHED +SPLATTED +SUICIDED
  End

  ; A crushing defeat
  Behavior = FXListDie ModuleTag_14
    DeathTypes = NONE +CRUSHED +SPLATTED
    DeathFX = FX_CarCrush
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior       = OCLUpdate ModuleTag_Respawn01 ; Context window is a reaction to this, no CommandSet 
    MinDelay     = 100
    MaxDelay     = 100
    CreateAtEdge = Yes ; as opposed to just creating on self

    FactionTriggered = Yes ; This requires a controlling player before it works
    
    FactionOCL   = Faction:America                   OCL:OCL_SkyShieldShellExplosionDetonationEffect
    FactionOCL   = Faction:China                     OCL:OCL_SkyShieldShellExplosionDetonationEffect
    FactionOCL   = Faction:GLA                       OCL:OCL_SkyShieldShellExplosionDetonationEffect    
    FactionOCL   = Faction:AmericaLaserGeneral       OCL:OCL_SkyShieldShellExplosionDetonationEffect    
    FactionOCL   = Faction:AmericaSuperWeaponGeneral OCL:OCL_SkyShieldShellExplosionDetonationEffect    
  End
  
  Behavior = CreateObjectDie ModuleTag_Respawn02
    DeathTypes = NONE +SUICIDED
    CreationList = OCL_NukeCannonNerveGasKillRespawn
    TransferPreviousHealth = Yes
  End

  Geometry = BOX
  GeometryMajorRadius = 32.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 17.0     
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length    

End