;------------------------------------------------------------------------------
Object ChinaTankECM

  ; *** ART Parameters ***
  SelectPortrait         = SNbanshee_L
  ButtonImage            = SNbanshee 

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model               = NVEcmTnk_WB
    End
  End
  
  Side = China
  EditorSorting = VEHICLE
  BuildCost       = 1000
  BuildTime       = 10.0          ;in seconds     
  
  Prerequisites
    Object        = ChinaWarFactory
    Object        = ChinaPropagandaCenter
  End
  
  BuildVariations = ChinaTankECM_Var1
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE CANNOT_RETALIATE

  Geometry            = BOX
  GeometryMajorRadius = 17.0
  GeometryMinorRadius = 12.0
  GeometryHeight      = 18.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME
  ShadowSizeX = 45

End

;------------------------------------------------------------------------------
Object ChinaTankECM_Var1

  ; *** ART Parameters ***
  SelectPortrait         = SNbanshee_L
  ButtonImage            = SNbanshee  
  
  UpgradeCameo1 = Upgrade_Nationalism

  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ExtraPublicBone = WEAPONA01

    ConditionState  = NONE
      Model         = NVEcmTnk
      Animation     = NVEcmTnk.NVEcmTnk
      AnimationMode = LOOP
      Flags         = MAINTAIN_FRAME_ACROSS_STATES
      HideSubObject = Sphere01
    End
    AliasConditionState = USING_WEAPON_A
    
    ConditionState = USING_WEAPON_B
      Model         = NVEcmTnk
      Animation     = NVEcmTnk.NVEcmTnk
      AnimationMode = LOOP
      Flags         = MAINTAIN_FRAME_ACROSS_STATES
      ShowSubObject = Sphere01
      ParticleSysBone = HouseColor03 ECMTankJammerFlare
    End
    
    ConditionState  = REALLYDAMAGED
      Model         = NVEcmTnk_D
      Animation     = NVEcmTnk_D.NVEcmTnk_D
      AnimationMode = LOOP
      Flags         = MAINTAIN_FRAME_ACROSS_STATES
      HideSubObject = Sphere01
    End
    AliasConditionState = REALLYDAMAGED USING_WEAPON_A
    AliasConditionState = RUBBLE
    
    ConditionState = REALLYDAMAGED USING_WEAPON_B
      Model         = NVEcmTnk_D
      Animation     = NVEcmTnk_D.NVEcmTnk_D
      AnimationMode = LOOP
      Flags         = MAINTAIN_FRAME_ACROSS_STATES
      ShowSubObject = Sphere01
      ParticleSysBone = HouseColor03 ECMTankJammerFlare
    End

    TrackMarks              = EXTnkTrack.tga
    TreadAnimationRate      = 4.0  ; amount of tread texture to move per second
  End

  ; ***DESIGN parameters ***
  DisplayName               = OBJECT:ECMTank
  Side                      = China
  EditorSorting             = SYSTEM
  TransportSlotCount        = 3            ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet
    Conditions              = None 
    Weapon                  = PRIMARY   SupportVehicleDummyWeapon
    Weapon                  = SECONDARY ECMTankCommunicationJammer
    AutoChooseSources       = SECONDARY NONE
  End

  ArmorSet
    Conditions    = None
    Armor         = TankArmor
    DamageFX      = TankDamageFX
  End
  BuildCost       = 1000
  BuildTime       = 10.0          ;in seconds    
  VisionRange     = 200
  ShroudClearingRange = 200
  
  Prerequisites
    Object        = ChinaWarFactory
    Object        = ChinaPropagandaCenter
  End

  ExperienceValue   = 70 70 70 70    ;Experience point value at each level
  IsTrainable       = No             ;Can gain experience
  CrusherLevel      = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel    = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  
  CommandSet = ChinaVehicleECMTankCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect     = FrequencyJammerVoiceSelect
  VoiceMove       = FrequencyJammerVoiceMove
  VoiceGuard      = FrequencyJammerVoiceMove
  VoiceAttack     = FrequencyJammerVoiceMove ;FrequencyJammerVoiceAttack
  SoundMoveStart  = MicrowaveTankMoveStart
  SoundMoveStartDamaged = MicrowaveTankMoveStart

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    VoiceCreate     = FrequencyJammerVoiceCreate
    VoiceEnter      = FrequencyJammerVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority     = UNIT
  KindOf            = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE CANNOT_RETALIATE

  
  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 300.0
    InitialHealth   = 300.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 600
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  
  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes NotWhileAttacking
  End
  
  Locomotor       = SET_NORMAL GattlingTankLocomotor
  Behavior          = PhysicsBehavior ModuleTag_04
    Mass            = 40.0
  End

    
  ; Just explode death
  Behavior = SlowDeathBehavior ModuleTag_05
    DestructionDelay = 1
    SinkRate = 0.5     ; in Dist/Sec
    OCL = FINAL    OCL_ChinaTankECMDebris
    FX  = FINAL    FX_GattlingExplosionOneFinal
  End

  Behavior = CreateCrateDie ModuleTag_06
    CrateData = SalvageCrateDataChinaTier1
  End

  Behavior = TransitionDamageFX ModuleTag_07
    ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
  End
  
  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 3       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = CommandButtonHuntUpdate  ModuleTag_22 ; allows use of command button hunt script with this unit. 
  End

  Behavior = FireWeaponUpdate ModuleTag_MissileJammer01
    Weapon = ECMTankMissileJammer
    ExclusiveWeaponDelay = 2100 ; If we fire a real weapon, we turn this module off for this long
  End
  
  Behavior = FireWeaponUpdate ModuleTag_MissileJammer02
    Weapon = ECMTankMissileJammerEffect
    ExclusiveWeaponDelay = 2100 ; If we fire a real weapon, we turn this module off for this long
  End
  
  Behavior = FireWeaponUpdate ModuleTag_MissileJammer03
    Weapon = ECMTankMissileJammerDecalWeapon
    ExclusiveWeaponDelay = 2100 ; If we fire a real weapon, we turn this module off for this long
  End
  
  Behavior = StealthUpdate ModuleTag_GPSStealth01
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = FIRING_PRIMARY FIRING_SECONDARY FIRING_TERTIARY RIDERS_ATTACKING
    InnateStealth               = Yes
    RequiredStatus              = REASSIGN_PARKING ;Used exclusively by the GPS Scrambler
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End

  Behavior = HordeUpdate ModuleTag_Horde01
    RubOffRadius = 150    ; if I am this close to a real hordesman, I will get to be an honorary hordesman
    UpdateRate = 1000     ; how often to recheck horde status (msec)
    Radius = 75           ; how close other units must be to us to count towards our horde-ness (~30 feet or so)
    KindOf = VEHICLE      ; what KindOf's must match to count towards horde-ness
    AlliesOnly = Yes      ; do we only count allies towards horde status? 
    Count = 5             ; how many units must be within Radius to grant us horde-ness
    Action = HORDE        ; when horde-ing, grant us the HORDE bonus
  End

  Behavior = EjectPilotDie ModuleTag_HijackerEmerge01
    DeathTypes = ALL -CRUSHED -SPLATTED
    RequiredStatus = HIJACKED
    VeterancyLevels =  ALL
    GroundCreationList = OCL_HijackerEmerge
    AirCreationList = OCL_HijackerEmergeViaParachute
  End
  
  Behavior = FXListDie ModuleTag_HijackerEmerge02
    RequiredStatus = HIJACKED
    DeathTypes = ALL -CRUSHED -SPLATTED
    DeathFX = FX_HijackerEmerge
  End
 
  Geometry            = BOX
  GeometryMajorRadius = 17.0
  GeometryMinorRadius = 12.0
  GeometryHeight      = 18.0     
  GeometryIsSmall     = Yes
  Shadow              = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length    

End