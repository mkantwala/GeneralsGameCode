; TheSuperHackers @feature Adds a buildable USA B-2 Spirit stealth bomber.
; The existing Carpet Bombing support plane keeps its own definition.
Object AmericaJetB2Bomber

  SelectPortrait = SAB3Carpet
  ButtonImage = SAB3Carpet
  UpgradeCameo1 = Upgrade_AmericaCountermeasures
  Scale = 0.40

  Draw = W3DModelDraw ModuleTag_Model
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model = AVB3bmbr
    End

    ConditionState = JETEXHAUST
      Model = AVB3bmbr
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = WingTip01 JetContrailThin
      ParticleSysBone = WingTip02 JetContrailThin
      ParticleSysBone = WingTip03 JetContrailThin
      ParticleSysBone = WingTip04 JetContrailThin
    End

    ConditionState = DAMAGED
      Model = AVB3bmbr_D
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
    End

    ConditionState = DAMAGED JETEXHAUST
      Model = AVB3bmbr_D
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = WingTip01 JetContrailThin
      ParticleSysBone = WingTip02 JetContrailThin
      ParticleSysBone = WingTip03 JetContrailThin
      ParticleSysBone = WingTip04 JetContrailThin
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
    End

    ConditionState = REALLYDAMAGED
      Model = AVB3bmbr_D
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
      ParticleSysBone = Smoke01 FireSmallContinuous
      ParticleSysBone = Smoke02 FireSmallContinuous
    End

    ConditionState = REALLYDAMAGED JETEXHAUST
      Model = AVB3bmbr_D
      ParticleSysBone = Engine01 JetBlackTrailThin
      ParticleSysBone = Engine02 JetBlackTrailThin
      ParticleSysBone = WingTip01 JetContrailThin
      ParticleSysBone = WingTip02 JetContrailThin
      ParticleSysBone = WingTip03 JetContrailThin
      ParticleSysBone = WingTip04 JetContrailThin
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
      ParticleSysBone = Smoke01 FireSmallContinuous
      ParticleSysBone = Smoke02 FireSmallContinuous
    End

    ConditionState = RUBBLE
      Model = AVB3bmbr_D1
      ParticleSysBone = Smoke01 JetSmoke
      ParticleSysBone = Smoke02 JetSmoke
      ParticleSysBone = Smoke01 FireSmallContinuous
      ParticleSysBone = Smoke02 FireSmallContinuous
    End
  End

  ; The stock ROTR helper supplies WEAPONA01 for the base game's B-2 model.
  Draw = W3DModelDraw ModuleTag_WeaponBone
    DefaultConditionState
      Model = AVB3bmbr_C
      WeaponLaunchBone = PRIMARY WeaponA
    End
  End

  DisplayName = OBJECT:AmericaB2Bomber
  EditorSorting = VEHICLE
  Side = America
  TransportSlotCount = 0
  VisionRange = 300.0
  ShroudClearingRange = 300.0
  Prerequisites
    Object = AmericaAirfield
    Object = AmericaStrategyCenter
  End
  BuildCost = 3200
  BuildTime = 40.0
  WeaponSet
    Conditions = None
    Weapon = PRIMARY AmericaB2BombWeapon
  End
  ArmorSet
    Conditions = None
    Armor = AirplaneArmor
    DamageFX = None
  End
  ArmorSet
    Conditions = PLAYER_UPGRADE
    Armor = CountermeasuresAirplaneArmor
    DamageFX = None
  End
  ExperienceValue = 200 200 400 400
  ExperienceRequired = 0 200 400 800
  IsTrainable = Yes
  CrusherLevel = 1
  CrushableLevel = 2
  CommandSet = AmericaJetB2BomberCommandSet

  ; Reuse USA stealth aircraft voices and the stock B-2 engine loop.
  VoiceSelect = StealthFighterVoiceSelect
  VoiceMove = StealthFighterVoiceMove
  VoiceAttack = StealthFighterVoiceAttack
  VoiceGuard = StealthFighterVoiceAirPatrol
  SoundAmbient = B3BomberAmbientLoop
  SoundAmbientRubble = NoSound
  SoundStealthOn = StealthOn
  SoundStealthOff = StealthOff
  UnitSpecificSounds
    VoiceCreate = StealthFighterVoiceCreate
    VoiceLowFuel = StealthFighterVoiceLowFuel
    VoiceGarrison = StealthFighterVoiceMove
  End

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS CAN_ATTACK SELECTABLE VEHICLE SCORE AIRCRAFT
  Body = ActiveBody ModuleTag_Body
    MaxHealth = 150.0
    InitialHealth = 150.0
    SubdualDamageCap = 900
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End
  Behavior = PhysicsBehavior ModuleTag_Physics
    Mass = 500.0
  End
  Behavior = JetSlowDeathBehavior ModuleTag_Death
    FXOnGroundDeath = FX_JetOnGroundDeath
    DestructionDelay = 5000
    RollRate = 0.2
    RollRateDelta = 100%
    PitchRate = 0.0
    FallHowFast = 110.0%
    FXInitialDeath = FX_JetBigDeathInitial
    DelaySecondaryFromInitialDeath = 500
    FXSecondary = FX_JetDeathSecondary
    FXHitGround = FX_JetDeathHitGround
    DelayFinalBlowUpFromHitGround = 200
    FXFinalBlowUp = FX_JetDeathFinalBlowUp
  End

  Behavior = JetAIUpdate ModuleTag_JetAI
    OutOfAmmoDamagePerSecond = 10%
    TakeoffDistForMaxLift = 0%
    TakeoffPause = 500
    MinHeight = 5
    AttackLocomotorType = SET_SUPERSONIC
    AttackLocomotorPersistTime = 100
    ; The attack locomotor changes speed without Aurora targeting protection.
    SneakyOffsetWhenAttacking = 0
    AttackersMissPersistTime = 0
    ReturnForAmmoLocomotorType = SET_SLUGGISH
    ReturnToBaseIdleTime = 10000
  End
  Locomotor = SET_NORMAL AmericaB2CruiseLocomotor
  Locomotor = SET_SUPERSONIC AmericaB2AttackLocomotor
  Locomotor = SET_SLUGGISH AmericaB2CruiseLocomotor
  Locomotor = SET_TAXIING BasicJetTaxiLocomotor

  Behavior = StealthUpdate ModuleTag_Stealth
    StealthDelay = 3000
    StealthForbiddenConditions = ATTACKING TAKING_DAMAGE
    FriendlyOpacityMin = 50.0%
    FriendlyOpacityMax = 100.0%
    InnateStealth = Yes
    OrderIdleEnemiesToAttackMeUponReveal = Yes
  End
  Behavior = ArmorUpgrade ModuleTag_ArmorUpgrade
    TriggeredBy = Upgrade_AmericaCountermeasures
  End
  Behavior = CountermeasuresBehavior ModuleTag_Countermeasures
    TriggeredBy = Upgrade_AmericaCountermeasures
    FlareTemplateName = CountermeasureFlare
    FlareBoneBaseName = Flare
    VolleySize = 1
    VolleyArcAngle = 60.0
    VolleyVelocityFactor = 0.45
    DelayBetweenVolleys = 200
    NumberOfVolleys = 12
    ReloadTime = 0
    MustReloadAtAirfield = Yes
    EvasionRate = 30%
    ReactionLaunchLatency = 0
    MissileDecoyDelay = 200
  End
  Behavior = FlammableUpdate ModuleTag_Flammable
    AflameDuration = 5000
    AflameDamageAmount = 3
    AflameDamageDelay = 500
  End
  Behavior = TransitionDamageFX ModuleTag_DamageFX
    ReallyDamagedParticleSystem1 = Bone:Smoke01 RandomBone:Yes Psys:SmokeSmallContinuous01
    ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_MIGDamageTransition
  End
  Behavior = FireWeaponCollide ModuleTag_AircraftCrateCollide
    CollideWeapon = AircraftCratePickupDummySpawner
    RequiredStatus = IS_CARBOMB
  End

  Geometry = Box
  GeometryIsSmall = Yes
  GeometryMajorRadius = 24.0
  GeometryMinorRadius = 4.0
  GeometryHeight = 4.0
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 89
End
