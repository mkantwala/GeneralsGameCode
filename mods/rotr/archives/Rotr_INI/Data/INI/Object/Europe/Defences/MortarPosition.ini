;------------------------------------------------------------------------------
Object EuropePioneerMortarPosition

  ; *** ART Parameters ***
  SelectPortrait          = SEMortarPosition_L
  ButtonImage             = SEMortarPosition
  
  UpgradeCameo1 = Upgrade_EuropeCannisterRounds
  UpgradeCameo2 = Upgrade_EuropeTearGasRounds
  UpgradeCameo3 = Upgrade_EuropeClusterMunitions
  
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    
    DefaultConditionState
      Model         = EBPnrPit
    End
    
    ConditionState  = SNOW
      Model         = EBPnrPit_S
    End
    
  End
  
  Draw = W3DModelDraw ModuleTag_Gunner01
    OkToChangeModelColor = Yes
    
    DefaultConditionState
      Model         = NVDeva_U2
      HideSubObject = EXO
    End
    AliasConditionState = PREATTACK_A
    AliasConditionState = FIRING_A
    AliasConditionState = BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RELOADING_A



    ConditionState = RIDER1
      Model = EIPioner_SKN_B
      IdleAnimation = EIPioner_SKL.EIPioner_MST 0 15
      IdleAnimation = EIPioner_SKL.EIPioner_MID
      AnimationMode = ONCE
      Turret = Box01
    End
    
    ConditionState = RIDER1 PREATTACK_A
      Model = EIPioner_SKN_B
      Animation = EIPioner_SKL.EIPioner_MATA
      AnimationMode = ONCE
      Turret = Box01
    End
    AliasConditionState = RIDER1 PREATTACK_B
    AliasConditionState = RIDER1 PREATTACK_C
    
    ConditionState = RIDER1 FIRING_A
      Model = EIPioner_SKN_B
      Animation = EIPioner_SKL.EIPioner_MATB
      AnimationMode = ONCE
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
      Turret = Box01
      TransitionKey = TRANS_Firing_A
      WeaponFireFXBone = PRIMARY   Muzzle
      WeaponLaunchBone = PRIMARY   Muzzle
      WeaponFireFXBone = SECONDARY Muzzle
      WeaponLaunchBone = SECONDARY Muzzle
      WeaponFireFXBone = TERTIARY  Muzzle
      WeaponLaunchBone = TERTIARY  Muzzle
    End
    AliasConditionState = RIDER1 FIRING_B
    AliasConditionState = RIDER1 FIRING_C
    
    ConditionState = RIDER1 BETWEEN_FIRING_SHOTS_A
      Model = EIPioner_SKN_B
      Animation = EIPioner_SKL.EIPioner_MST
      AnimationMode = LOOP
      WaitForStateToFinishIfPossible = TRANS_Firing_A
      Turret = Box01
    End
    AliasConditionState = RIDER1 RELOADING_A
    AliasConditionState = RIDER1 BETWEEN_FIRING_SHOTS_B
    AliasConditionState = RIDER1 RELOADING_B
    AliasConditionState = RIDER1 BETWEEN_FIRING_SHOTS_C
    AliasConditionState = RIDER1 RELOADING_C
    
  End
  
  PlacementViewAngle = -45

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:MortarPosition
  Side             = Europe
  EditorSorting    = SYSTEM
  
  EnergyProduction = 0
  VisionRange     = 400.0
  ShroudClearingRange     = 250.0
  
  ArmorSet
    Conditions      = None
    Armor           = StructureArmor
    DamageFX        = DefaultDamageFX
  End
 
  WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY   NONE
  End
 
  WeaponSet
    Conditions        = WEAPON_RIDER1 
    Weapon            = PRIMARY   PioneerMortarPositionWeapon
    Weapon            = SECONDARY PioneerMortarPositionCannisterWeapon
    AutoChooseSources = SECONDARY NONE
    Weapon            = TERTIARY  PioneerMortarPositionTeargasWeapon
    AutoChooseSources = TERTIARY  NONE
    ShareWeaponReloadTime = Yes    
  End
  
  ExperienceValue    = 40 40  70  90   ;Experience point value at each level
  ExperienceRequired = 0  200 300 500  ;Experience points needed to gain each level
  IsTrainable        = Yes             ;Can gain experience
  
  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
 ;KindOf          = PRELOAD STRUCTURE SELECTABLE CAN_ATTACK IMMOBILE IMMUNE_TO_CAPTURE CAN_SEE_THROUGH_STRUCTURE STICK_TO_TERRAIN_SLOPE FS_BASE_DEFENSE
  KindOf          = PRELOAD SELECTABLE CAN_ATTACK IMMOBILE IMMUNE_TO_CAPTURE CAN_SEE_THROUGH_STRUCTURE STICK_TO_TERRAIN_SLOPE FS_BASE_DEFENSE CAN_CAST_REFLECTIONS
  Body            = StructureBody ModuleTag_02
    MaxHealth       = 250.0   
    InitialHealth   = 250.0
  End

  ; *** AUDIO Parameters ***
  VoiceSelect = PioneerMortarPositionSelect
  VoiceAttack = PioneerVoiceMortarAttack

  UnitSpecificSounds
    VoicePrimaryWeaponMode   = PioneerVoiceExplosiveRounds
    VoiceSecondaryWeaponMode = PioneerVoiceCannisterRounds
    VoiceTertiaryWeaponMode  = PioneerVoiceTearGasRounds
  End
  
  Behavior = AIUpdateInterface ModuleTag_AI03
    Turret
      TurretTurnRate        = 360
      RecenterTime          = 999999999999
      ControlledWeaponSlots = PRIMARY SECONDARY TERTIARY
    End
    AutoAcquireEnemiesWhenIdle = Yes ATTACK_BUILDINGS Stealthed; defensive weapon
    MoodAttackCheckRate        = 30
  End  

  Behavior = RiderChangeContain ModuleTag_16
  
    Rider1 = EuropeInfantryPioneer          RIDER1 WEAPON_RIDER1 STATUS_RIDER1 EuropeInfantryPioneerMortarPositionCommandSet SET_NORMAL
    Rider8 = GenericFakeRider1_Default_Rank RIDER8 WEAPON_RIDER8 STATUS_RIDER8 StopOnlyGenericCommandSet SET_NORMAL
    ScuttleDelay          = 1
    ScuttleStatus         = TOPPLED

    ;Standard TransportContain stuff
    Slots                 = 1
    InitialPayload        = GenericFakeRider1_Default_Rank 1
    DamagePercentToUnits  = 100%
    BurnedDeathToUnits    = No
    AllowInsideKindOf     = CAN_ATTACK
    GoAggressiveOnExit    = Yes ; AI Will tell people to set their mood to Aggressive on exiting
    EnterSound            = GarrisonEnter
  End
  
  Behavior = SubObjectsUpgrade ModuleTag_Venom01
    TriggeredBy    = Upgrade_EuropeVenom
    ShowSubObjects = EXO
  End
  
  Behavior = DestroyDie ModuleTag_11
    DeathTypes = ALL
  End

  Behavior = FXListDie ModuleTag_072415
    DeathFX = FX_MerceneryFoxHoleCollapse
  End

;  Behavior = CreateObjectDie ModuleTag_1123241
;    RequiredStatus = STATUS_RIDER1
;    CreationList   = OCL_EuropePioneerMortarPositionInfantryDeathObject
;  End

  Behavior = FlammableUpdate ModuleTag_07
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  
   ;This upgraded is used to make alot of ingame effects work properly
   ;DO NOT REMOVE!
  Behavior = GrantUpgradeCreate ModuleTag_AlwaysGrantedUpgrade01
    UpgradeToGrant     = Upgrade_CostReduction
  End
  
  Behavior = StealthUpdate ModuleTag_GPSStealth01
    StealthDelay                = 2000 ; msec
    StealthForbiddenConditions  = FIRING_PRIMARY FIRING_SECONDARY FIRING_TERTIARY RIDERS_ATTACKING
    InnateStealth               = Yes
    RequiredStatus              = REASSIGN_PARKING ;Used exclusively by the GPS Scrambler
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End

  Geometry            = BOX
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight      = 6.0
  GeometryIsSmall     = No
  Shadow              = SHADOW_VOLUME
  BuildCompletion     = PLACED_BY_PLAYER

End


;------------------------------------------------------------------------------
Object EuropePioneerMortarPositionInfantryDeathObject

  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes

    ; --- Idle
    DefaultConditionState
      Model = EIPioner_SKN
      Animation = EIPioner_SKL.EIPioner_DTA
      Animation = EIPioner_SKL.EIPioner_DTB
      Animation = EIPioner_SKL.EIPioner_DTC
      Animation = EIPioner_SKL.EIPioner_DTD
      AnimationMode = ONCE
    End
    
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Pioneer
  Side                = Europe
  EditorSorting       = SYSTEM
  TransportSlotCount  = 0
  
  ArmorSet
    Conditions      = None
    Armor           = HumanArmor
    DamageFX        = InfantryDamageFX
  End

  CrushableLevel      = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles


  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS INFANTRY

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 200.0
    InitialHealth   = 200.0
  End

  Behavior = PhysicsBehavior ModuleTag_05
    Mass = 5.0
  End

  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes          = ALL
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    FX                  = INITIAL FX_PioneerDie
  End
; --- end Death modules ---

  Behavior = LifetimeUpdate ModuleTag_Remove01
    MinLifetime = 0
    MaxLifetime = 0
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 12.0
  GeometryIsSmall = Yes
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14;
  ShadowSizeY = 14;
  ShadowTexture = ShadowI;
  BuildCompletion = APPEARS_AT_RALLY_POINT

End