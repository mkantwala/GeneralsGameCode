;------------------------------------------------------------------------------
Object EuropeInfantryPioneer

  ; *** ART Parameters ***
  SelectPortrait          = SECombatPioneer_L
  ButtonImage             = SECombatPioneer

  UpgradeCameo1 = Upgrade_EuropeCeramicArmor
  UpgradeCameo2 = Upgrade_EuropeCannisterRounds
  UpgradeCameo3 = Upgrade_EuropeTearGasRounds
  UpgradeCameo4 = Upgrade_EuropeClusterMunitions
  
  
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    
    DefaultConditionState
      Model = EIPioner_SKN
      IdleAnimation = EIPioner_SKL.EIPioner_STA 0 15
      IdleAnimation = EIPioner_SKL.EIPioner_IDA
      IdleAnimation = EIPioner_SKL.EIPioner_IDB
      AnimationMode = ONCE
      HideSubObject = EXO
      WeaponFireFXBone = PRIMARY Muzzle
      WeaponLaunchBone = PRIMARY Muzzle
      WeaponFireFXBone = TERTIARY Muzzle
      WeaponLaunchBone = TERTIARY Muzzle
      TransitionKey = TRANS_Stand
    End
    
    ;Moving animations
    ConditionState = MOVING
      Animation = EIPioner_SKL.EIPioner_RNA 22
      Animation = EIPioner_SKL.EIPioner_RNB 25
      AnimationMode = LOOP
      Flags = RANDOMSTART
      ParticleSysBone = None InfantryDustTrails
    End
    AliasConditionState = MOVING FIRING_A
    AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState = MOVING RELOADING_A
    
    ;Submachinegun attack animations    
    ConditionState = FIRING_A 
      Animation = EIPioner_SKL.EIPioner_ATA
      AnimationMode = LOOP
      TransitionKey = TRANS_Firing_A
    End
    AliasConditionState = BETWEEN_FIRING_SHOTS_A
    AliasConditionState = RELOADING_A  
    
    ;Mortar attack animations
    ConditionState = PREATTACK_C
      Model = EIPioner_SKN_B
      Animation = EIPioner_SKL.EIPioner_MDP
      AnimationMode = ONCE
      TransitionKey = TRANS_Firing_Pre_Attack_C
    End
    
    ConditionState = FIRING_C
      Model = EIPioner_SKN_B
      Animation = EIPioner_SKL.EIPioner_MATB
      AnimationMode = ONCE
      Flags = PRISTINE_BONE_POS_IN_FINAL_FRAME
      TransitionKey = TRANS_Firing_C
    End
    
    ConditionState = BETWEEN_FIRING_SHOTS_C
      Model = EIPioner_SKN_B
      Animation = EIPioner_SKL.EIPioner_MATA
      AnimationMode = ONCE
      TransitionKey = TRANS_Reloading_C
      WaitForStateToFinishIfPossible = TRANS_Firing_C
    End
    AliasConditionState = RELOADING_C
    
    TransitionState = TRANS_Firing_Pre_Attack_C TRANS_Stand
      Animation = EIPioner_SKL.EIPioner_MDP
      AnimationMode = ONCE_BACKWARDS
    End
    
    TransitionState = FIRING_C TRANS_Stand
      Animation = EIPioner_SKL.EIPioner_MDP
      AnimationMode = ONCE_BACKWARDS
    End
    
    TransitionState = TRANS_Reloading_C TRANS_Stand
      Animation = EIPioner_SKL.EIPioner_MDP
      AnimationMode = ONCE_BACKWARDS
    End

    ; -------Laying mine animations
    ConditionState      = PREATTACK_B
      Model             = EIPioner_SKN_C
      ShowSubObject     = SHOVEL02
      Animation         = UIWRKR_SKL.UIWRKR_PIK
      AnimationMode     = ONCE_BACKWARDS
    End

    ; ------- Building/digging animations
    ConditionState      = UNPACKING
      Model             = EIPioner_SKN_C
      HideSubObject     = SHOVEL02
      Animation         = UIWRKR_SKL.UIWRKR_BDB
      AnimationMode     = ONCE_BACKWARDS
    End
    
    ;Death animations
    ConditionState = DYING
      Animation = EIPioner_SKL.EIPioner_DTA
      Animation = EIPioner_SKL.EIPioner_DTB
      Animation = EIPioner_SKL.EIPioner_DTC
      Animation = EIPioner_SKL.EIPioner_DTD
      AnimationMode = ONCE
      TransitionKey = TRANS_Dying
    End
    
    TransitionState = TRANS_Dying TRANS_Flailing
      Animation = EIPioner_SKL.EIPioner_ATDA
      AnimationMode = ONCE
    End
    
    ConditionState = DYING EXPLODED_FLAILING
      Animation = EIPioner_SKL.EIPioner_ATDB
      AnimationMode = LOOP
      TransitionKey = TRANS_Flailing
    End
    
    ConditionState = DYING EXPLODED_BOUNCING
      Animation = EIPioner_SKL.EIPioner_ATDC
      AnimationMode = ONCE
    End
    AliasConditionState = DYING SPLATTED
    
    
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:Pioneer
  Side                = Europe
  EditorSorting       = INFANTRY
  TransportSlotCount  = 1                 ;how many "slots" we take in a transport (0 == not transportable)
  
  WeaponSet
    Conditions        = None
    Weapon            = PRIMARY   PioneerSubMachinegunWeapon
    Weapon            = SECONDARY PioneerAntiTankMineWeapon
    AutoChooseSources = SECONDARY NONE
    Weapon            = TERTIARY  PioneerMortarBarrageWeapon
    AutoChooseSources = TERTIARY  NONE
  End

  
  ArmorSet
    Conditions      = None
    Armor           = HumanArmor
    DamageFX        = InfantryDamageFX
  End

  VisionRange = 220
  ShroudClearingRange = 220
  
  Prerequisites
    Object = EuropeSolarReactor
  End
  
  BuildCost = 700
  BuildTime = 8.0          ;in seconds  
  
  ExperienceValue    = 40 40  70  90   ;Experience point value at each level
  ExperienceRequired = 0  200 300 500  ;Experience points needed to gain each levell
  IsTrainable = Yes             ;Can gain experience
  CrushableLevel      = 0  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet          = EuropeInfantryPioneerCommandSet

  ; *** AUDIO Parameters ***
  VoiceSelect       = PioneerVoiceSelect
  VoiceAttack       = PioneerVoiceAttack
  VoiceAttackAir    = PioneerVoiceAttack
  VoiceFear         = PioneerVoiceFear
  VoiceMove         = PioneerVoiceMove
  VoiceGuard        = PioneerVoiceMove

  UnitSpecificSounds
    VoiceGarrison       = PioneerVoiceGarrison
    VoiceCreate         = PioneerVoiceCreate
    VoiceEnter          = PioneerVoiceMove
    VoiceGetHealed      = PioneerVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS INFANTRY HUGE_VEHICLE SCORE SALVAGER

  Behavior = CommandButtonHuntUpdate ModuleTag_02
  End

  Body = ActiveBody ModuleTag_03
    MaxHealth       = 120.0
    InitialHealth   = 120.0
  End
  
  Behavior = MaxHealthUpgrade ModuleTag_Armor01
    TriggeredBy   = Upgrade_EuropeCeramicArmor
    AddMaxHealth  = 30.0
    ChangeType    = ADD_CURRENT_HEALTH_TOO
  End

  Behavior = AIUpdateInterface ModuleTag_06
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor = SET_NORMAL BasicHumanLocomotor
  Locomotor = SET_NORMAL_UPGRADED EuropeanInfantryExoSkeletonLocomotor

  Behavior = PhysicsBehavior ModuleTag_07
    Mass = 5.0
  End
  
  Behavior = SpecialAbility ModuleTag_DigFoxHoleAbillity01
    SpecialPowerTemplate     = SpecialAbilityMercenaryDigFoxHole
    UpdateModuleStartsAttack = Yes
    StartsPaused = No
    InitiateSound = PioneerVoiceDigin
  End
  
  Behavior = SpecialAbilityUpdate ModuleTag_DigFoxHoleAbillity02
    SpecialPowerTemplate               = SpecialAbilityMercenaryDigFoxHole
    StartAbilityRange                  = 5.0
    PreparationTime                    = 0
    SpecialObjectAttachToBone          = NONE
    SpecialObject                      = PioneerCreateMortarPositionObject
    MaxSpecialObjects                  = 1
    SpecialObjectsPersistWhenOwnerDies = Yes 
    SpecialObjectsPersistent           = Yes      ;Charges are persistent till lifetime expires or owner detonates them.
    UniqueSpecialObjectTargets         = No      ;This would prevent multiple charges placed on the same object.
    UnpackTime                         = 6000.0
    PackTime                           = 1.0
    FlipOwnerAfterUnpacking            = No
    FleeRangeAfterCompletion           = 5.0     ;Dees not run away after finishing ability
    UnpackSound                        = NoSound
    LoseStealthOnTrigger               = No
    ApproachRequiresLOS                = No      ; we are a helicopter, we can see everything
    NeedToFaceTarget                   = No      ; can drop the bomb at any angle to target
    UnpackSound                        = MercenaryShovelDig
  End

  ;Venom exo skeleton upgrade modules
  Behavior = SubObjectsUpgrade ModuleTag_Venom01
    TriggeredBy    = Upgrade_EuropeVenom
    ShowSubObjects = EXO
  End
  
  Behavior = LocomotorSetUpgrade ModuleTag_Venom02
    TriggeredBy   = Upgrade_EuropeVenom
  End

; --- begin Death modules ---

  Behavior = SlowDeathBehavior ModuleTag_Death01
    DeathTypes          = ALL -CRUSHED -SPLATTED -TOPPLED -EXPLODED -BURNED -POISONED -POISONED_BETA -POISONED_GAMMA -LASERED -EXTRA_2 -EXTRA_3 -EXTRA_4 -EXTRA_5 -EXTRA_6 -EXTRA_7
    DestructionDelay    = 0
    OCL                 = INITIAL OCL_WoundedPioneer
    FX                  = INITIAL FX_PioneerDie
  End
  Behavior = SlowDeathBehavior ModuleTag_Death02
    DeathTypes          = NONE +CRUSHED +SPLATTED +TOPPLED
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    FX                  = INITIAL FX_GIDieCrushed
  End
  Behavior = SlowDeathBehavior ModuleTag_Death03
    DeathTypes          = NONE +EXPLODED
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    FX                  = INITIAL FX_PioneerDie
    FlingForce          = 8
    FlingForceVariance  = 3
    FlingPitch          = 60
    FlingPitchVariance  = 10
  End
  Behavior = SlowDeathBehavior ModuleTag_Death04
    DeathTypes          = NONE +BURNED
    DestructionDelay    = 0
    FX                  = INITIAL FX_PioneerFireDie
    OCL                 = INITIAL OCL_FlamingInfantry
  End
  Behavior = SlowDeathBehavior ModuleTag_Death05
    DeathTypes          = NONE +POISONED
    DestructionDelay    = 0
    FX                  = INITIAL FX_PioneerToxinDie
    OCL                 = INITIAL OCL_ToxicInfantry
  End  
  Behavior = SlowDeathBehavior ModuleTag_Death06 ; don't forget to give it a new, unique module tag
    DeathTypes          = NONE +POISONED_BETA
    DestructionDelay    = 0
    FX                  = INITIAL FX_PioneerToxinDie
    OCL                 = INITIAL OCL_ToxicInfantryBeta ;you'll have to create this OCL and make it use the blue guys instead of green ones
  End  
  Behavior = SlowDeathBehavior ModuleTag_Death07
    DeathTypes          = NONE +POISONED_GAMMA
    DestructionDelay    = 0
    FX                  = INITIAL FX_PioneerTeslaDie
    OCL                 = INITIAL OCL_TeslaDeathInfantry
    FX                  = FINAL   FX_IfantryTeslaDie
  End  
  Behavior = SlowDeathBehavior ModuleTag_Death08 ;new and shiney microwave death effect
    DeathTypes          = NONE +EXTRA_2
    DestructionDelay    = 0
    FX                  = INITIAL FX_PioneerFireDie
    OCL                 = INITIAL OCL_MicrowavedInfantry 
  End  
  Behavior = SlowDeathBehavior ModuleTag_Death09
    DeathTypes          = NONE +EXTRA_3
    DestructionDelay    = 0
    FX                  = INITIAL FX_PioneerToxinDie
    OCL                 = INITIAL OCL_ViralInfantryDeath
  End
  Behavior = SlowDeathBehavior ModuleTag_Death045 ;Brutal kill with lots of blood and no death scream
    DeathTypes          = NONE +EXTRA_4
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    OCL                 = INITIAL OCL_BrutalBloodyDeathBits
    FX                  = INITIAL FX_InfantryGoreExplosion
  End
  Behavior = SlowDeathBehavior ModuleTag_036 ;Gore death explosion
    DeathTypes          = NONE +EXTRA_5
    ProbabilityModifier = 30
    DestructionDelay    = 0
    OCL                 = INITIAL OCL_BloodyGoreExplosion
    FX                  = FINAL   FX_InfantryGoreExplosion
  End
  Behavior = SlowDeathBehavior ModuleTag_Death0323
    DeathTypes          = NONE +EXTRA_5
    ProbabilityModifier = 70
    SinkDelay           = 3000
    SinkRate            = 0.5     ; in Dist/Sec
    DestructionDelay    = 8000
    FX                  = INITIAL FX_PioneerDie
    OCL                 = INITIAL OCL_BrutalBloodyDeathBits
    FlingForce          = 8
    FlingForceVariance  = 3
    FlingPitch          = 60
    FlingPitchVariance  = 10
  End
  Behavior = SlowDeathBehavior ModuleTag_03241156 ;Radiation Melt
    DeathTypes          = NONE +EXTRA_6
    DestructionDelay    = 0
    OCL                 = INITIAL OCL_RadiationDeathInfantry
    FX                  = INITIAL FX_GIDieRadiation
    FX                  = FINAL   FX_PioneerToxinDie
  End
  Behavior = SlowDeathBehavior ModuleTag_0323241156 ;Radiation Melt
    DeathTypes          = NONE +EXTRA_7
    DestructionDelay    = 0
    OCL                 = INITIAL OCL_NeutronRadiationDeathInfantry
    FX                  = INITIAL FX_GIDieRadiation
    FX                  = FINAL   FX_PioneerToxinDie
  End
  Behavior = SlowDeathBehavior ModuleTag_03231 ;Cryogenic Freeze death
    DeathTypes          = NONE +LASERED
    DestructionDelay    = 0
    FX                  = INITIAL FX_GIDieCryoFreeze
    OCL                 = INITIAL OCL_CrygenicDeathInfantry
  End
; --- end Death modules ---

  Behavior = SquishCollide ModuleTag_12
    ;nothing
  End

  Behavior = PoisonedBehavior ModuleTag_17
    PoisonDamageInterval = 100  ; Every this many msec I will retake the poison damage dealt me...
    PoisonDuration = 3000       ; ... for this long after last hit by poison damage
  End


  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 12.0
  GeometryIsSmall = Yes
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14;
  ShadowSizeY = 14;
  ShadowTexture = ShadowI;
  BuildCompletion = APPEARS_AT_RALLY_POINT

End