    AliasConditionState = SNOW REALLYDAMAGED RIDER2 NIGHT
    
  End

  ; ***DESIGN parameters ***
  DisplayName           = OBJECT:Warhound
  Side                  = Europe
  EditorSorting         = VEHICLE
  TransportSlotCount    = 3                 ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet
    Conditions = WEAPON_RIDER1
;    Weapon              = PRIMARY   WarhoundMachinegunDummyWeapon
;    AutoChooseSources   = PRIMARY   NONE
    Weapon              = SECONDARY  WarhoundMachinegunWeapon
    Weapon              = TERTIARY   WarhoundMachineDiginExplosiveChargeWeapon
    AutoChooseSources   = TERTIARY   NONE
  End

  WeaponSet
    Conditions = WEAPON_RIDER1 HERO
;    Weapon              = PRIMARY   WarhoundMachinegunDummyWeapon
;    AutoChooseSources   = PRIMARY   NONE
    Weapon              = SECONDARY  WarhoundMachinegunHeroicWeapon
    Weapon              = TERTIARY   WarhoundMachineDiginExplosiveChargeWeapon
    AutoChooseSources   = TERTIARY   NONE
  End

  WeaponSet
    Conditions = WEAPON_RIDER2 
    Weapon              = PRIMARY   WarhoundMortarCannonDummyWeapon
    AutoChooseSources   = PRIMARY   NONE
    Weapon              = SECONDARY WarhoundMortarCannonWeapon
  End

  WeaponSet
    Conditions = WEAPON_RIDER2  HERO
    Weapon              = PRIMARY   WarhoundMortarCannonDummyWeapon
    AutoChooseSources   = PRIMARY   NONE
    Weapon              = SECONDARY WarhoundMortarCannonWeapon
  End
  
  ArmorSet
    Conditions      = None
    Armor           = WarhoundTankArmor
    DamageFX        = TankDamageFX
  End
  
  Prerequisites
    Object = EuropeFieldCommand
  End
  
  BuildCost       = 1000
  BuildTime       = 12.0          ;in seconds    
  VisionRange     = 220
  ShroudClearingRange = 200
  
  ExperienceValue    = 80 80 150 300    ;Experience point value at each level
  ExperienceRequired = 0 200 300 600    ;Experience points needed to gain each level
  IsTrainable = Yes             ;Can gain experience
  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles

  ; *** AUDIO Parameters ***
  VoiceSelect           = WarhoundVoiceSelect
  VoiceMove             = WarhoundVoiceMove
  VoiceGuard            = WarhoundVoiceMove
  VoiceAttack           = WarhoundVoiceAttack
  SoundMoveStart        = WarhoundMoveStart
  SoundMoveStartDamaged = WarhoundMoveStart

  UnitSpecificSounds
    VoiceCreate         = WarhoundVoiceCreate
    VoiceCrush          = WarhoundVoiceMove
    VoiceEnter          = WarhoundVoiceMove
    VoiceFlameLocation  = WarhoundVoicePlaceDemolitionCharge
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE TRANSPORT FS_BASE_DEFENSE CANNOT_RETALIATE SALVAGER

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 200.0
    InitialHealth   = 200.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 1200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 50
  End

  Behavior = TransportAIUpdate ModuleTag_03
    Turret
      ControlledWeaponSlots = PRIMARY SECONDARY
      TurretTurnRate        = 100
      TurretPitchRate       = 100
      FirePitch             = 20
      AllowsPitch           = Yes
      MinIdleScanAngle      = 10
      MaxIdleScanAngle      = 40
      MinIdleScanInterval   = 5000
      MaxIdleScanInterval   = 10000
    End
    TurretsLinked = Yes
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate = 33
  End  
  Locomotor = SET_NORMAL WarhoundLocomotor
  Locomotor = SET_SUPERSONIC GuardianDroneDugInLocomotor
  
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 50.0
  End
  
  
  
  ;*************************************
  ;******Transformation Code Start******
  ;*************************************
  
  Behavior = RiderChangeContain ModuleTag_Transform01

    ;Standard mode
    Rider1 = GenericFakeRider1_Default_Rank  RIDER1 WEAPON_RIDER1 STATUS_RIDER1 EuropeTankWarhoundMobileCommandSet SET_NORMAL
    
    ;Dugin mode
    Rider2 = GenericFakeRider2_Default_Rank RIDER2 WEAPON_RIDER2 STATUS_RIDER2 EuropeTankWarhoundDuginCommandSet  SET_SUPERSONIC
    
    ;We start with this rider that has the mobile button dissabled permanently then once we get out of our digout position we switch to rider 1 and never use this again
    Rider3 = BombTruckNeutronBombRider          RIDER1 WEAPON_RIDER1 STATUS_RIDER1 EuropeTankWarhoundMobileAlternativeCommandset SET_NORMAL

    ;Standard TransportContain stuff
    Slots                 = 1
    InitialPayload        = BombTruckNeutronBombRider 1
    DamagePercentToUnits  = 100%
    BurnedDeathToUnits    = No
    AllowInsideKindOf     = CAN_ATTACK    
    ScuttleDelay          = 100
    ScuttleStatus         = TOPPLED
  End  
  
  Behavior = ProductionUpdate  ModuleTag_Transform03
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End
  
  ;Grant this upgrade for system purposes
  Behavior = GrantUpgradeCreate ModuleTag_Transform11
    UpgradeToGrant     = Upgrade_ChinaOverlordGattlingCannon
  End
  
  ;Grant this upgrade for system purposes
  Behavior = GrantUpgradeCreate ModuleTag_Transform02
    UpgradeToGrant     = Upgrade_ChinaOverlordBattleBunker
  End
  
  ;This module fires a weapon with a dummy collision object that ensures that we always have collision
  Behavior = FireWeaponUpdate ModuleTag_Transform12
    Weapon = GenericCollisionDummyWeapon
  End
  
  ;This makes sure that all abbilities are initialy dissabled
  Behavior = ObjectCreationUpgrade ModuleTag_Transform10
    UpgradeObject   = OCL_WarhoundSwitchModeDelayObject
    TriggeredBy     = Upgrade_ChinaOverlordGattlingCannon
  End  

  ;these modules control the warhound from emerging from its burrowed position
  Behavior = ObjectCreationUpgrade ModuleTag_Transform04
    UpgradeObject   = OCL_WarhoundMobileMode
    TriggeredBy     = Upgrade_GLAWorkerRealCommandSet
    ConflictsWith   = Upgrade_ChinaOverlordBattleBunker
    FXListUpgrade   = FX_GuardianDronePopoutofGround
    RequiresAllTriggers = Yes
  End 
  
  Behavior = FireWeaponCollide ModuleTag_Transform05
    CollideWeapon   = WarhoundSwitchToMobileMode
    RequiredStatus  = STATUS_RIDER8
  End
  
  Behavior = MaxHealthUpgrade ModuleTag_Transform09
    TriggeredBy   = Upgrade_GLAWorkerRealCommandSet
    ConflictsWith = Upgrade_ChinaOverlordBattleBunker
    AddMaxHealth  = -400.0 ; And remove them when i come back out
    ChangeType    = PRESERVE_RATIO
  End
  
  ;these modules control the warhound from digging into a burrowed position
  Behavior = ObjectCreationUpgrade ModuleTag_Transform06
    UpgradeObject   = OCL_WarhoundDuginMode
    TriggeredBy     = Upgrade_GLAWorkerFakeCommandSet
    ConflictsWith   = Upgrade_ChinaOverlordGattlingCannon
    FXListUpgrade   = FX_GuardianDroneDigInGround
    RequiresAllTriggers = No
  End 
  
  Behavior = FireWeaponCollide  ModuleTag_Transform07
    CollideWeapon   = WarhoundSwitchToDiginMode
    RequiredStatus  = STATUS_RIDER7
  End

  Behavior = MaxHealthUpgrade ModuleTag_Transform08
    TriggeredBy   = Upgrade_GLAWorkerFakeCommandSet
    ConflictsWith = Upgrade_ChinaOverlordGattlingCannon
    AddMaxHealth  = 400.0 ; Give me 400 more hit points when dug in
    ChangeType    = PRESERVE_RATIO
    RequiresAllTriggers = No
  End
  
  ;This module ensures that units around us think of us as a building and will not attempt to drive through me
  Behavior = FireWeaponCollide ModuleTag_Transform16
    CollideWeapon  = WarhoundDuginCollisionDummyWeapon
    RequiredStatus = STATUS_RIDER2
  End
  
  ;these modules control the warhound repair aura when burrowed
  Behavior = FireWeaponCollide ModuleTag_Transform13
    CollideWeapon  = WarhoundRepairVehicleWeapon
    RequiredStatus = STATUS_RIDER2
  End

  Behavior = FireWeaponCollide ModuleTag_Transform14
    CollideWeapon  = WarhoundRepairDecalWeapon
    RequiredStatus = STATUS_RIDER2
  End

  ;this one only becomes active after the appropriate upgrade
  Behavior = FireWeaponCollide ModuleTag_Transform15
    CollideWeapon  = WarhoundRepairBuildingWeapon
