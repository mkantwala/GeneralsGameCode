      Flags               = START_FRAME_FIRST
    End

    TransitionState       = TRANS_DAMAGED_SNOW_IMMOBILE TRANS_DAMAGED_SNOW_MOBILE
      Model               = EVAvre_Dirt_SD
      Animation           = EVAvre_Dirt_SD.EVAvre_Dirt_SD
      AnimationMode       = ONCE_BACKWARDS
